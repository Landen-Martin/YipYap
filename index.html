<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="YipYap — a decentralized, peer-to-peer social network with encrypted rooms, a ranked feed, and private on-device analytics.">
<meta name="theme-color" content="#16161a">
<meta name="color-scheme" content="dark light">
<title>YipYap | P2P Social</title>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
:root {
    --bg-primary:#16161a; --bg-secondary:#1e1e24; --bg-tertiary:#2a2a32; --bg-floating:#313138;
    --text-normal:#f5f5f5; --text-muted:#a0a0a8; --text-link:#ff8c42;
    --accent:#ff7b00; --accent-hover:#e66e00; --danger:#ff4d4d; --success:#52d869; --warning:#ffc107;
    --border-color:#3a3a42; --scrollbar-thumb:#3a3a42; --scrollbar-track:#1e1e24;
    --shadow:0 4px 12px rgba(0,0,0,0.3);
    --gradient:linear-gradient(135deg,#ff8c42 0%,#ff5e00 100%);
}
[data-theme="light"] {
    --bg-primary:#f9f9f9; --bg-secondary:#ffffff; --bg-tertiary:#f1f1f1; --bg-floating:#ffffff;
    --text-normal:#1e1e1e; --text-muted:#6b6b6b; --text-link:#e66e00;
    --accent:#ff7b00; --accent-hover:#cc6300; --danger:#ef4444; --success:#22c55e; --warning:#f59e0b;
    --border-color:#e2e2e2; --scrollbar-thumb:#cbd5e1; --scrollbar-track:#f1f1f1;
    --shadow:0 4px 12px rgba(0,0,0,0.05);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg-primary); color:var(--text-normal);
    display:flex; height:100vh; height:100dvh; overflow:hidden; font-size:15px;
    -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }

.app-layout { display:flex; width:100%; height:100%; }

.sidebar { width:240px; background-color:var(--bg-secondary); display:flex; flex-direction:column;
    flex-shrink:0; border-right:1px solid var(--border-color); transition:transform 0.25s ease; z-index:100; }
.sidebar-header { padding:20px; font-weight:700; font-size:1.25rem; border-bottom:1px solid var(--border-color);
    display:flex; justify-content:space-between; align-items:center; background:var(--gradient);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sidebar-nav { flex-grow:1; padding:15px 10px; overflow-y:auto; }
.nav-item { padding:11px 12px; color:var(--text-muted); cursor:pointer; font-size:0.95rem;
    transition:background 0.2s,color 0.2s; border-radius:6px; margin-bottom:2px; font-weight:500;
    display:flex; align-items:center; gap:10px; user-select:none; }
.nav-item svg { width:18px; height:18px; flex-shrink:0; }
.nav-item:hover { background-color:var(--bg-tertiary); color:var(--text-normal); }
.nav-item.active { background-color:var(--accent); color:#ffffff; }
.sidebar-footer { padding:12px 15px; border-top:1px solid var(--border-color); display:flex;
    align-items:center; gap:10px; background:var(--bg-secondary); }
.user-avatar { width:36px; height:36px; border-radius:50%; background:var(--gradient);
    display:flex; align-items:center; justify-content:center; font-weight:bold; color:#ffffff;
    font-size:0.95rem; flex-shrink:0; cursor:pointer; }
.user-info { flex-grow:1; overflow:hidden; }
.user-name { font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-status { font-size:0.72rem; color:var(--success); display:flex; align-items:center; gap:4px; }
.user-status::before { content:''; width:7px; height:7px; background:var(--success); border-radius:50%; display:inline-block; }
.user-status.offline { color:var(--text-muted); }
.user-status.offline::before { background:var(--text-muted); }

.main-content { flex-grow:1; display:flex; flex-direction:column; background-color:var(--bg-primary); min-width:0; }
.main-header { padding:15px 20px; border-bottom:1px solid var(--border-color); display:flex;
    justify-content:space-between; align-items:center; box-shadow:var(--shadow); z-index:5;
    gap:10px; min-height:56px; }
.main-header h2 { font-size:1.15rem; font-weight:700; }
.header-actions { display:flex; gap:8px; align-items:center; }
.main-body { flex-grow:1; overflow-y:auto; padding:20px; min-height:0; -webkit-overflow-scrolling:touch; }

.menu-toggle { display:none; background:transparent; border:none; color:var(--text-normal); cursor:pointer; padding:6px; }
.menu-toggle svg { width:22px; height:22px; }

.view { display:none; height:100%; flex-direction:column; min-height:0; }
.view.active { display:flex; }

.auth-wrapper { display:flex; align-items:center; justify-content:center; height:100vh; height:100dvh;
    width:100vw; background:var(--bg-tertiary); position:fixed; inset:0; z-index:1000; padding:20px; }
.auth-card { background:var(--bg-secondary); padding:35px 30px; border-radius:14px; box-shadow:var(--shadow);
    width:420px; max-width:100%; border:1px solid var(--border-color); }
.auth-logo { text-align:center; margin-bottom:8px; font-size:2rem; font-weight:800; background:var(--gradient);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.auth-card p.sub { text-align:center; color:var(--text-muted); margin-bottom:28px; font-size:0.9rem; }

.form-group { margin-bottom:16px; }
.form-group label { display:block; margin-bottom:7px; font-size:0.82rem; font-weight:600; color:var(--text-muted); }
input[type="text"],input[type="password"],input[type="email"],input[type="search"],textarea.input-field,select {
    width:100%; padding:11px 13px; background:var(--bg-tertiary); border:1px solid var(--border-color);
    border-radius:7px; color:var(--text-normal); font-size:0.95rem; outline:none;
    transition:border 0.2s,background 0.2s; font-family:inherit; }
textarea.input-field { resize:vertical; min-height:60px; }
input:focus,textarea:focus,select:focus { border-color:var(--accent); background:var(--bg-secondary); }

.btn { padding:10px 16px; border:none; border-radius:7px; cursor:pointer; font-size:0.92rem; font-weight:600;
    transition:background 0.2s,opacity 0.2s,transform 0.1s; display:inline-flex; align-items:center;
    justify-content:center; gap:8px; font-family:inherit; }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--accent); color:#ffffff; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-secondary { background:transparent; color:var(--text-muted); border:1px solid var(--border-color); }
.btn-secondary:hover { color:var(--text-normal); border-color:var(--text-muted); background:var(--bg-tertiary); }
.btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn-danger:hover { background:var(--danger); color:#ffffff; }
.btn-block { width:100%; }
.btn-small { padding:6px 12px; font-size:0.82rem; }
.btn-icon { background:transparent; border:none; color:var(--text-muted); cursor:pointer; padding:7px;
    border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.btn-icon:hover { background:var(--bg-tertiary); color:var(--text-normal); }
.btn-icon svg { width:18px; height:18px; }
.btn:disabled { opacity:0.55; cursor:not-allowed; }

.feed-container { max-width:700px; margin:0 auto; width:100%; }
.post-composer { background:var(--bg-secondary); padding:14px; border-radius:10px;
    border:1px solid var(--border-color); margin-bottom:18px; }
.composer-row { display:flex; gap:10px; align-items:flex-start; }
.composer-row textarea { flex:1; }
.composer-actions { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; }
.composer-attach-preview { margin-top:10px; position:relative; display:inline-block; max-width:200px; }
.composer-attach-preview img,.composer-attach-preview video { max-width:100%; max-height:150px; border-radius:6px; display:block; }
.composer-attach-preview .remove-att { position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.7);
    color:white; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:14px; line-height:1; }

.post-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:10px;
    padding:16px; margin-bottom:14px; transition:border 0.2s; }
.post-card:hover { border-color:var(--text-muted); }
.post-main { display:flex; gap:12px; }
.post-content { flex-grow:1; min-width:0; }
.post-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.post-author { font-weight:700; color:var(--text-normal); cursor:pointer; }
.post-author:hover { color:var(--accent); text-decoration:underline; }
.post-time { font-size:0.74rem; color:var(--text-muted); }
.post-text { color:var(--text-normal); line-height:1.5; margin-bottom:10px; white-space:pre-wrap; word-wrap:break-word; }

.post-attachment { margin:10px 0; border-radius:8px; overflow:hidden; }
.post-attachment img { max-width:100%; max-height:400px; border-radius:8px; cursor:pointer; display:block; }
.post-attachment video { max-width:100%; max-height:400px; border-radius:8px; display:block; }
.post-attachment .file-att { display:flex; align-items:center; gap:8px; background:var(--bg-tertiary);
    padding:10px 12px; border-radius:8px; color:var(--accent); text-decoration:none; font-size:0.88rem; }
.post-attachment .file-att:hover { background:var(--bg-floating); }

.post-actions { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--border-color); flex-wrap:wrap; align-items:center; }
.action-btn { background:transparent; border:1px solid var(--border-color); padding:5px 11px;
    border-radius:5px; color:var(--text-muted); cursor:pointer; font-size:0.82rem; font-weight:500;
    transition:all 0.15s; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
.action-btn:hover { border-color:var(--text-muted); color:var(--text-normal); }
.action-btn.active-like { border-color:var(--success); color:var(--success); background:rgba(82,216,105,0.1); }
.action-btn.active-dislike { border-color:var(--danger); color:var(--danger); background:rgba(255,77,77,0.1); }
.action-btn svg { width:14px; height:14px; flex-shrink:0; }
.action-btn.report-btn { margin-left:auto; }

.reply-section { margin-top:12px; padding-left:48px; display:flex; flex-direction:column; gap:8px; }
.reply-card { background:var(--bg-tertiary); padding:9px 12px; border-radius:6px; border-left:2px solid var(--accent); }
.reply-header { display:flex; gap:8px; align-items:baseline; margin-bottom:3px; }
.reply-author { font-weight:600; font-size:0.85rem; cursor:pointer; }
.reply-author:hover { color:var(--accent); }
.reply-time { font-size:0.7rem; color:var(--text-muted); }
.reply-text { font-size:0.88rem; line-height:1.4; }
.reply-input-row { display:flex; gap:8px; margin-top:4px; }
.reply-input-row input { padding:7px 10px; font-size:0.85rem; }

.empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty-state-icon { font-size:2.5rem; margin-bottom:12px; opacity:0.4; }
.empty-state-text { font-size:1.05rem; margin-bottom:6px; }
.empty-state-sub { font-size:0.88rem; }

.rooms-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:900px; margin:0 auto; }
.card { background:var(--bg-secondary); padding:18px; border-radius:10px; border:1px solid var(--border-color); }
.card h3 { margin-bottom:14px; font-size:1.05rem; font-weight:700; }
.room-list-item { background:var(--bg-tertiary); padding:11px 14px; border-radius:6px; margin-bottom:7px;
    display:flex; justify-content:space-between; align-items:center; border:1px solid transparent;
    transition:border 0.15s; gap:10px; }
.room-list-item:hover { border-color:var(--border-color); }
.room-list-item .room-info { flex:1; min-width:0; }
.room-list-item .room-name { font-weight:600; font-size:0.92rem; }
.room-list-item .room-meta { font-size:0.75rem; color:var(--text-muted); }

#view-chat .main-body { padding:0; display:flex; flex-direction:column; }
.chat-container { display:flex; flex-direction:column; height:100%; flex-grow:1; min-height:0; }
.chat-history { flex-grow:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column;
    gap:12px; min-height:0; -webkit-overflow-scrolling:touch; }
.chat-msg { display:flex; gap:10px; max-width:80%; animation:fadeIn 0.2s; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.chat-msg.right { align-self:flex-end; flex-direction:row-reverse; }
.chat-msg.self .chat-msg-bubble { background:var(--accent); color:white; }
.chat-msg-bubble { background:var(--bg-tertiary); padding:9px 13px; border-radius:12px;
    font-size:0.92rem; line-height:1.4; word-wrap:break-word; max-width:100%; }
.chat-msg-meta { font-size:0.7rem; color:var(--text-muted); margin-top:3px; }
.chat-msg.right .chat-msg-meta { text-align:right; }
.chat-msg-author { font-weight:600; font-size:0.78rem; margin-bottom:2px; color:var(--accent); }
.chat-msg-system { color:var(--text-muted); font-style:italic; text-align:center; font-size:0.82rem; padding:4px 0; }
.chat-msg-attachment { margin-top:6px; }
.chat-msg-attachment img { max-width:220px; max-height:220px; border-radius:6px; display:block; }
.chat-msg-attachment video { max-width:220px; max-height:220px; border-radius:6px; display:block; }

.typing-indicator { flex-shrink:0; height:22px; padding:0 18px; font-size:0.78rem; color:var(--text-muted);
    font-style:italic; background:var(--bg-secondary); opacity:0; transition:opacity 0.2s; }
.typing-indicator.visible { opacity:1; }

.chat-input-area { flex-shrink:0; padding:12px 16px; background:var(--bg-secondary);
    border-top:1px solid var(--border-color); display:flex; gap:8px; align-items:flex-end; }
.chat-input-area input[type="text"] { flex:1; border-radius:8px; }

.profile-container { max-width:700px; margin:0 auto; }
.profile-header-card { background:var(--bg-secondary); border:1px solid var(--border-color);
    border-radius:12px; overflow:hidden; margin-bottom:18px; }
.profile-banner { height:100px; background:var(--gradient); }
.profile-info { padding:0 18px 18px; display:flex; gap:14px; align-items:flex-start; }
.profile-info .user-avatar { width:80px; height:80px; font-size:2rem;
    border:4px solid var(--bg-secondary); margin-top:-50px; flex-shrink:0; position:relative; z-index:1; }
.profile-details { flex:1; padding-top:16px; min-width:0; }
.profile-name { font-size:1.3rem; font-weight:700; }
.profile-email { color:var(--text-muted); font-size:0.85rem; }
.profile-stats { display:flex; gap:18px; margin-top:12px; }
.stat { text-align:center; }
.stat-num { font-weight:700; font-size:1.1rem; }
.stat-label { font-size:0.72rem; color:var(--text-muted); }
.profile-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

.settings-container { max-width:650px; margin:0 auto; }
.settings-section { background:var(--bg-secondary); border:1px solid var(--border-color);
    border-radius:10px; margin-bottom:16px; overflow:hidden; }
.settings-header { padding:13px 18px; border-bottom:1px solid var(--border-color); font-weight:700; background:var(--bg-tertiary); }
.setting-row { padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border-color); gap:12px; }
.setting-row:last-child { border-bottom:none; }
.setting-info h4 { font-size:0.92rem; font-weight:600; margin-bottom:3px; }
.setting-info p { font-size:0.82rem; color:var(--text-muted); }
.toggle { position:relative; display:inline-block; width:40px; height:24px; flex-shrink:0; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; cursor:pointer; inset:0; background-color:var(--bg-tertiary);
    transition:.3s; border-radius:24px; border:1px solid var(--border-color); }
.toggle-slider:before { position:absolute; content:""; height:18px; width:18px; left:2px; bottom:2px;
    background-color:var(--text-muted); transition:.3s; border-radius:50%; }
.toggle input:checked + .toggle-slider { background-color:var(--accent); border-color:var(--accent); }
.toggle input:checked + .toggle-slider:before { transform:translateX(16px); background-color:#fff; }

.toast-container { position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
.toast { background:var(--bg-floating); border:1px solid var(--border-color); padding:13px 16px;
    border-radius:8px; box-shadow:var(--shadow); min-width:260px; max-width:360px; display:flex;
    gap:10px; align-items:center; animation:slideIn 0.3s ease;
    border-left:4px solid var(--accent); font-size:0.88rem; transition:opacity .25s, transform .25s; }
.toast.success { border-left-color:var(--success); }
.toast.error { border-left-color:var(--danger); }
.toast.warning { border-left-color:var(--warning); }
@keyframes slideIn { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:2000;
    display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.15s; }
.modal { background:var(--bg-secondary); border-radius:12px; padding:24px; width:100%; max-width:460px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); animation:slideUp 0.2s; max-height:90vh; overflow-y:auto; }
@keyframes slideUp { from { transform:translateY(15px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal h3 { margin-bottom:14px; font-size:1.15rem; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
.modal.legal { max-width:560px; }
.modal.legal .legal-body { font-size:0.88rem; line-height:1.55; color:var(--text-normal); max-height:55vh; overflow-y:auto; }
.modal.legal .legal-body h4 { margin:14px 0 6px; font-size:0.95rem; }
.modal.legal .legal-body p { margin-bottom:10px; color:var(--text-muted); }

.hidden { display:none !important; }
.text-muted { color:var(--text-muted); font-size:0.85rem; }
.text-center { text-align:center; }
.mt-10 { margin-top:10px; }
.mt-20 { margin-top:20px; }

.checkbox-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; font-size:0.88rem; color:var(--text-muted); }
.checkbox-row input { margin-top:3px; flex-shrink:0; }
.checkbox-row a { color:var(--accent); cursor:pointer; text-decoration:underline; }

.analytics-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
.analytics-card { background:var(--bg-tertiary); border:1px solid var(--border-color); border-radius:10px; padding:14px; }
.analytics-card h4 { font-size:0.85rem; margin-bottom:8px; color:var(--text-muted); }
.analytics-card .big-num { font-size:1.6rem; font-weight:700; }
.chart-box { background:var(--bg-tertiary); border-radius:8px; padding:10px; height:140px; position:relative; }
.chart-box canvas { width:100% !important; height:100% !important; }

/* --- User analytics additions (match existing design language) --- */
.live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--success);
    margin-right:6px; animation:livePulse 1.6s ease-in-out infinite; vertical-align:middle; }
@keyframes livePulse { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
.ratio-bar { display:flex; height:10px; border-radius:6px; overflow:hidden;
    background:var(--bg-primary); border:1px solid var(--border-color); }
.ratio-bar .ratio-like { background:var(--success); transition:width .3s ease; }
.ratio-bar .ratio-dislike { background:var(--danger); transition:width .3s ease; }
.ratio-legend { display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); margin-top:6px; }
.metric-list { display:flex; flex-direction:column; gap:8px; }
.metric-row { display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    background:var(--bg-tertiary); border-radius:8px; font-size:0.88rem; gap:10px; }
.metric-row .metric-label { color:var(--text-muted); }
.metric-row .metric-value { font-weight:700; }
.top-post-row { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 12px; background:var(--bg-tertiary); border-radius:8px; margin-bottom:8px; }
.top-post-row:last-child { margin-bottom:0; }
.top-post-text { flex:1; min-width:0; font-size:0.86rem; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; color:var(--text-normal); }
.top-post-meta { font-size:0.75rem; color:var(--text-muted); white-space:nowrap; }

@media (max-width:768px) {
    .app-layout { flex-direction:column; }
    .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%);
        box-shadow:2px 0 20px rgba(0,0,0,0.3); }
    .sidebar.open { transform:translateX(0); }
    .menu-toggle { display:block; }
    .main-body { padding:14px; }
    .rooms-grid { grid-template-columns:1fr; }
    .reply-section { padding-left:0; }
    .chat-msg { max-width:90%; }
    .post-card { padding:14px; }
    .auth-card { padding:25px 20px; }
    .toast-container { left:12px; right:12px; top:12px; }
    .toast { min-width:0; max-width:100%; }
    .profile-stats { gap:12px; }
    .main-header { padding:12px 14px; }
    .main-header h2 { font-size:1.05rem; }

<script>
/* ============================================================================
   YipYap — Peer-to-Peer Social Network
   ---------------------------------------------------------------------------
   Architecture overview
     • Storage layer    : guarded localStorage + IndexedDB for attachments.
     • Identity         : PBKDF2-SHA256 (WebCrypto) with a pure-JS fallback.
     • Session          : stored separately from the main database so a partial
                          database failure can never lock a user out.
     • Database         : a single in-memory object (`DB`) that is the source of
                          truth; persistence is explicit and debounced.
     • Transport        : PeerJS/WebRTC. One elected "directory" peer relays
                          feed posts, public room registrations and follows.
     • Analytics        : computed on demand from real post interaction data.
   ============================================================================ */
'use strict';

/* ============================================================================
   1. CONSTANTS
   ============================================================================ */
const DB_KEY            = 'yipyap_db_v9';
const LEGACY_DB_KEYS    = ['yipyap_db_v8'];
const SESSION_KEY       = 'yipyap_session_v1';
const ANALYTICS_KEY     = 'yipyap_analytics_v1';
const DIR_ID            = 'yipyap-dir-v9';

const FEED_ALGO_THRESHOLD = 25;    // feed size below which we show pure recency
const REPORT_THRESHOLD    = 0.25;  // 25% of viewers reporting hides a post
const REPORT_MIN_COUNT    = 2;
const MAX_FILE_SIZE       = 2 * 1024 * 1024;
const MAX_POSTS           = 300;
const MAX_VIEWED_BY       = 80;
const PBKDF2_ITERATIONS   = 100000;
const PBKDF2_FALLBACK_IT  = 4000;
const ANALYTICS_WINDOW    = 14;
const ANALYTICS_REFRESH   = 2000;

/* ============================================================================
   2. GUARDED STORAGE LAYER
   ---------------------------------------------------------------------------
   localStorage can throw (private mode, disabled cookies, quota). Every access
   is wrapped and reported as a status string so callers can react instead of
   silently losing data.
   ============================================================================ */
const Storage = (function () {
    let available = false;
    const memory = {};

    try {
        const probe = '__yipyap_probe__';
        window.localStorage.setItem(probe, '1');
        window.localStorage.removeItem(probe);
        available = true;
    } catch (_) {
        available = false;
    }

    return {
        isPersistent() { return available; },

        get(key) {
            if (available) {
                try { return window.localStorage.getItem(key); } catch (_) { /* fall through */ }
            }
            return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
        },

        /** @returns {'ok'|'quota'|'memory'} */
        set(key, value) {
            memory[key] = value;
            if (!available) return 'memory';
            try {
                window.localStorage.setItem(key, value);
                return 'ok';
            } catch (_) {
                return 'quota';
            }
        },

        remove(key) {
            delete memory[key];
            if (available) { try { window.localStorage.removeItem(key); } catch (_) {} }
        }
    };
})();

function safeParse(raw, fallback) {
    if (raw == null || raw === '') return fallback;
    try {
        const parsed = JSON.parse(raw);
        return parsed == null ? fallback : parsed;
    } catch (_) {
        return fallback;
    }
}

/* ============================================================================
   3. CRYPTO — PBKDF2-SHA256 with a dependency-free fallback
   ============================================================================ */
const PureSHA256 = (function () {
    const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];

    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

    function utf8Bytes(str) {
        const out = [];
        for (let i = 0; i < str.length; i++) {
            let c = str.charCodeAt(i);
            if (c < 0x80) {
                out.push(c);
            } else if (c < 0x800) {
                out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
            } else if (c >= 0xd800 && c < 0xdc00 && i + 1 < str.length) {
                const c2 = str.charCodeAt(++i);
                c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
                out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
            } else {
                out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
            }
        }
        return out;
    }

    function digest(bytes) {
        const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const len = bytes.length;
        const buf = bytes.slice();
        buf.push(0x80);
        while (buf.length % 64 !== 56) buf.push(0);
        const bitsHi = Math.floor((len * 8) / 0x100000000);
        const bitsLo = (len * 8) >>> 0;
        buf.push((bitsHi >>> 24) & 255, (bitsHi >>> 16) & 255, (bitsHi >>> 8) & 255, bitsHi & 255);
        buf.push((bitsLo >>> 24) & 255, (bitsLo >>> 16) & 255, (bitsLo >>> 8) & 255, bitsLo & 255);

        const w = new Array(64);
        for (let i = 0; i < buf.length; i += 64) {
            for (let j = 0; j < 16; j++) {
                w[j] = (buf[i + j * 4] << 24) | (buf[i + j * 4 + 1] << 16) |
                       (buf[i + j * 4 + 2] << 8) | buf[i + j * 4 + 3];
            }
            for (let j = 16; j < 64; j++) {
                const s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
                const s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
                w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
            }
            let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
            for (let j = 0; j < 64; j++) {
                const S1  = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                const ch  = (e & f) ^ (~e & g);
                const t1  = (h + S1 + ch + K[j] + w[j]) | 0;
                const S0  = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                const maj = (a & b) ^ (a & c) ^ (b & c);
                const t2  = (S0 + maj) | 0;
                h = g; g = f; f = e; e = (d + t1) | 0;
                d = c; c = b; b = a; a = (t1 + t2) | 0;
            }
            H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
            H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
        }
        const out = [];
        H.forEach(x => out.push((x >>> 24) & 255, (x >>> 16) & 255, (x >>> 8) & 255, x & 255));
        return out;
    }

    return {
        bytes(str) { return digest(utf8Bytes(str)); },
        hex(str) { return digest(utf8Bytes(str)).map(b => b.toString(16).padStart(2, '0')).join(''); }
    };
})();

function hasWebCrypto() {
    return typeof window !== 'undefined' &&
           window.crypto && window.crypto.subtle && typeof window.crypto.subtle.importKey === 'function';
}

function bytesToHex(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i++) out += bytes[i].toString(16).padStart(2, '0');
    return out;
}
function hexToBytes(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
}
function bytesToBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
}
function randomHex(byteCount) {
    const bytes = new Uint8Array(byteCount);
    if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
    } else {
        for (let i = 0; i < byteCount; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    return bytesToHex(bytes);
}

/** Derive a hex hash. Uses WebCrypto when available, otherwise a JS fallback. */
async function deriveHash(password, saltHex, iterations) {
    if (hasWebCrypto()) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
        );
        const bits = await window.crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: hexToBytes(saltHex), iterations, hash: 'SHA-256' },
            keyMaterial,
            256
        );
        return bytesToHex(new Uint8Array(bits));
    }
    // Deterministic iterated SHA-256 fallback (slower per round, so fewer rounds).
    let acc = saltHex + '|' + password;
    const rounds = Math.min(iterations, PBKDF2_FALLBACK_IT);
    for (let i = 0; i < rounds; i++) acc = PureSHA256.hex(acc + '|' + i + '|' + saltHex);
    return acc;
}

async function createPasswordRecord(password) {
    const salt = randomHex(16);
    const hash = await deriveHash(password, salt, PBKDF2_ITERATIONS);
    return {
        passAlgo: 'pbkdf2-sha256',
        passSalt: salt,
        passIterations: PBKDF2_ITERATIONS,
        passHash: hash
    };
}

async function verifyPassword(password, user) {
    if (user.passAlgo === 'pbkdf2-sha256' && user.passSalt && user.passHash) {
        const candidate = await deriveHash(password, user.passSalt, user.passIterations || PBKDF2_ITERATIONS);
        return timingSafeEqual(candidate, user.passHash);
    }
    // Legacy v8 accounts stored an unsalted base64 SHA-256 digest.
    if (typeof user.passHash === 'string' && user.passHash.length > 0) {
        let legacy;
        if (hasWebCrypto()) {
            const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
            legacy = bytesToBase64(new Uint8Array(buf));
        } else {
            legacy = bytesToBase64(PureSHA256.bytes(password));
        }
        return timingSafeEqual(legacy, user.passHash);
    }
    return false;
}

function timingSafeEqual(a, b) {
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
}

/* ============================================================================
   4. SMALL UTILITIES
   ============================================================================ */
function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(value) {
    if (value == null) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function lastNDays(n) {
    const out = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
        out.push(dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i).getTime()));
    }
    return out;
}

function formatNumber(n) {
    if (!isFinite(n)) return '0';
    const v = Math.round(n * 10) / 10;
    if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1) + 'M';
    if (Math.abs(v) >= 10000) return (v / 1000).toFixed(1) + 'K';
    return String(v % 1 === 0 ? v : v.toFixed(1));
}

function isSafeDataUrl(url) {
    return typeof url === 'string' &&
           /^data:(image|video|audio|application|text)\//i.test(url);
}

async function copyText(text) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
        }
        showToast('Copied!', 'success');
    } catch (_) {
        showToast('Copy failed — select the text manually.', 'error');
    }
}

function viewImage(src) {
    if (!isSafeDataUrl(src) && !/^blob:/.test(src)) return;
    const viewer = document.createElement('div');
    viewer.className = 'image-viewer';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    viewer.appendChild(img);
    viewer.onclick = () => viewer.remove();
    document.body.appendChild(viewer);
}

function toggleAuthView() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('registerForm').classList.toggle('hidden');
}

const authErrorTimers = {};
function showAuthError(elementId, message) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
    clearTimeout(authErrorTimers[elementId]);
    authErrorTimers[elementId] = setTimeout(() => el.classList.add('hidden'), 6000);
}

/* ============================================================================
   5. DATABASE  (single source of truth + explicit persistence)
   ============================================================================ */
let DB = null;

function defaultSettings() {
    return {
        theme: 'dark',
        notifications: true,
        sound: true,
        chatAlign: 'me-right',
        filterLanguage: true,
        shareAnalytics: true
    };
}

function defaultDB() {
    return {
        version: 9,
        users: {},
        following: [],
        followers: [],
        posts: [],
        interestProfile: {},
        likedPosts: [],
        dislikedPosts: [],
        viewedPosts: [],
        reportsMade: {},
        reputation: {},
        settings: defaultSettings()
    };
}

/** Convert a v8 post into the v9 shape (timestamped interaction lists). */
function migratePost(raw) {
    const post = Object.assign({}, raw);
    const toEntries = (list, fallbackTime) => (Array.isArray(list) ? list : [])
        .map(x => (typeof x === 'string' ? { id: x, time: fallbackTime } : x))
        .filter(x => x && x.id);

    post.likedBy    = toEntries(post.likedBy, post.time || Date.now());
    post.dislikedBy = toEntries(post.dislikedBy, post.time || Date.now());
    post.viewedBy   = toEntries(post.viewedBy, post.time || Date.now()).slice(-MAX_VIEWED_BY);
    post.viewerCount = Math.max(
        Number(post.viewers) || 0,
        post.viewedBy.length
    );
    post.replies = Array.isArray(post.replies) ? post.replies : [];
    post.reports = Array.isArray(post.reports) ? post.reports : [];

    delete post.likes;
    delete post.dislikes;
    delete post.viewers;
    return post;
}

function migrateLegacyDB() {
    for (let i = 0; i < LEGACY_DB_KEYS.length; i++) {
        const raw = Storage.get(LEGACY_DB_KEYS[i]);
        if (!raw) continue;
        const old = safeParse(raw, null);
        if (!old || typeof old !== 'object') continue;

        const fresh = defaultDB();
        fresh.users          = old.users || {};
        fresh.following      = Array.isArray(old.following) ? old.following : [];
        fresh.followers      = Array.isArray(old.followers) ? old.followers : [];
        fresh.interestProfile = old.interestProfile || {};
        fresh.likedPosts     = Array.isArray(old.likedPosts) ? old.likedPosts : [];
        fresh.dislikedPosts  = Array.isArray(old.dislikedPosts) ? old.dislikedPosts : [];
        fresh.viewedPosts    = Array.isArray(old.viewedPosts) ? old.viewedPosts : [];
        fresh.reportsMade    = old.reportsMade || {};
        fresh.reputation     = old.reputation || {};
        fresh.settings       = Object.assign(defaultSettings(), old.settings || {});
        delete fresh.settings.filterLanguage_removed;

        const seen = new Set();
        const posts = [];
        (Array.isArray(old.myPosts) ? old.myPosts : [])
            .concat(Array.isArray(old.feedCache) ? old.feedCache : [])
            .forEach(p => {
                if (!p || !p.id || seen.has(p.id)) return;
                seen.add(p.id);
                posts.push(migratePost(p));
            });
        posts.sort((a, b) => b.time - a.time);
        fresh.posts = posts.slice(0, MAX_POSTS);

        Storage.set(DB_KEY, JSON.stringify(fresh));
        Storage.remove(LEGACY_DB_KEYS[i]);
        return fresh;
    }
    return null;
}

function loadDB() {
    const raw = Storage.get(DB_KEY);
    if (raw) {
        const parsed = safeParse(raw, null);
        if (parsed && typeof parsed === 'object') {
            const base = defaultDB();
            DB = Object.assign(base, parsed);
            DB.settings = Object.assign(defaultSettings(), parsed.settings || {});
            DB.users = parsed.users || {};
            DB.posts = (Array.isArray(parsed.posts) ? parsed.posts : []).map(migratePost);
            DB.following = Array.isArray(parsed.following) ? parsed.following : [];
            DB.followers = Array.isArray(parsed.followers) ? parsed.followers : [];
            DB.likedPosts = Array.isArray(parsed.likedPosts) ? parsed.likedPosts : [];
            DB.dislikedPosts = Array.isArray(parsed.dislikedPosts) ? parsed.dislikedPosts : [];
            DB.viewedPosts = Array.isArray(parsed.viewedPosts) ? parsed.viewedPosts : [];
            DB.reportsMade = parsed.reportsMade || {};
            DB.reputation = parsed.reputation || {};
            DB.interestProfile = parsed.interestProfile || {};
            return DB;
        }
        // Corrupt payload — keep a copy for the user before resetting.
        Storage.set(DB_KEY + '_corrupt_backup', raw);
        showToast('Saved data was unreadable. A backup was kept and a fresh profile was created.', 'warning', 7000);
    }

    const migrated = migrateLegacyDB();
    DB = migrated || defaultDB();
    persist();
    return DB;
}

/** Write the whole database. @returns {'ok'|'quota'|'memory'} */
function persist() {
    if (!DB) return 'memory';
    if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
    try {
        return Storage.set(DB_KEY, JSON.stringify(DB));
    } catch (err) {
        console.error('[persist]', err);
        return 'quota';
    }
}

let persistTimer = null;
function schedulePersist(delay) {
    if (persistTimer) clearTimeout(persistTimer);
    persistTimer = setTimeout(() => { persistTimer = null; persist(); }, delay == null ? 800 : delay);
}

   6. SESSION  (stored separately so a DB failure can never lock users out)

function saveSession(userId) {

        v: 1
    }));

function readSession() { return safeParse(Storage.get(SESSION_KEY), null); }
function clearSession() { Storage.remove(SESSION_KEY); }

/* ============================================================================
   7. ATTACHMENTS  (IndexedDB with an inline-data-URL fallback)
   ============================================================================ */
const attachmentMemCache = new Map();

const AttachmentStore = (function () {
    const DB_NAME = 'yipyap_attachments';
    const STORE   = 'files';
    const VERSION = 1;

    let handle = null;
    let supported = false;
    let opening = null;

    function openOnce() {
        if (opening) return opening;
        opening = new Promise(resolve => {
            if (typeof indexedDB === 'undefined') { resolve(false); return; }
            let req;
            try { req = indexedDB.open(DB_NAME, VERSION); } catch (_) { resolve(false); return; }

            let settled = false;
            const finish = ok => { if (!settled) { settled = true; resolve(ok); } };

            req.onupgradeneeded = () => {
                const d = req.result;
                if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
            };
            req.onsuccess = () => { handle = req.result; supported = true; finish(true); };
            req.onerror   = () => finish(false);
            req.onblocked = () => finish(false);
            setTimeout(() => finish(supported), 4000);
        });
        return opening;
    }

    function tx(mode) {
        return handle.transaction(STORE, mode).objectStore(STORE);
    }

    return {
        async init() { return openOnce(); },
        isSupported() { return supported; },

        put(record) {
            if (!supported || !handle) return Promise.resolve(false);
            return new Promise(resolve => {
                try {
                    const req = tx('readwrite').put(record);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => resolve(false);
                } catch (_) { resolve(false); }
            });
        },

        getAll() {
            if (!supported || !handle) return Promise.resolve([]);
            return new Promise(resolve => {
                try {
                    const req = tx('readonly').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                } catch (_) { resolve([]); }
            });
        },

        remove(id) {
            if (!supported || !handle) return Promise.resolve(false);
            return new Promise(resolve => {
                try {
                    const req = tx('readwrite').delete(id);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => resolve(false);
                } catch (_) { resolve(false); }
            });
        },

        clear() {
            if (!supported || !handle) return Promise.resolve(false);
            return new Promise(resolve => {
                try {
                    const req = tx('readwrite').clear();
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => resolve(false);
                } catch (_) { resolve(false); }
            });
        }
    };
})();

async function initAttachments() {
    const ok = await AttachmentStore.init();
    if (!ok) return;
    const records = await AttachmentStore.getAll();
    records.forEach(r => {
        if (r && r.id && r.dataUrl) attachmentMemCache.set(r.id, r.dataUrl);
    });
}

/**
 * Take a transient attachment (with a data URL) and turn it into a lightweight
 * reference. The heavy payload goes to IndexedDB.
 */
function storeAttachment(att) {
    if (!att) return null;
    if (!att.dataUrl) return att;                       // already a reference
    if (!isSafeDataUrl(att.dataUrl)) return null;       // refuse anything odd

    const id = att.id || uid('att');
    attachmentMemCache.set(id, att.dataUrl);

    if (AttachmentStore.isSupported()) {
        AttachmentStore.put({
            id,
            name: att.name || 'file',
            type: att.type || 'application/octet-stream',
            size: att.size || 0,
            dataUrl: att.dataUrl
        });
        return { id, name: att.name, type: att.type, size: att.size };
    }
    // Fallback: keep the payload inline so the app still works without IndexedDB.
    return { id, name: att.name, type: att.type, size: att.size, dataUrl: att.dataUrl };
}

/** Resolve a stored reference back into a renderable attachment. */
function expandAttachment(att) {
    if (!att) return null;
    if (att.dataUrl) return att;
    const dataUrl = attachmentMemCache.get(att.id);
    return dataUrl ? Object.assign({}, att, { dataUrl }) : att;
}

function pruneOrphanAttachments() {
    if (!AttachmentStore.isSupported()) return;
    const live = new Set();
    DB.posts.forEach(p => { if (p.attachment && p.attachment.id) live.add(p.attachment.id); });
    attachmentMemCache.forEach((_v, id) => {
        if (!live.has(id)) {
            attachmentMemCache.delete(id);
            AttachmentStore.remove(id);
        }
    });
}

/* ============================================================================
   8. USER ANALYTICS TRACKING (local counters, never uploaded)
   ============================================================================ */
function defaultAnalytics() {
    return { daily: {}, totals: { posts: 0, likes: 0, reports: 0, messages: 0, sessions: 0 }, lastDay: null };
}
function getAnalytics() {
    const raw = safeParse(Storage.get(ANALYTICS_KEY), null);
    if (!raw || typeof raw !== 'object') return defaultAnalytics();
    const base = defaultAnalytics();
    return {
        daily: raw.daily || base.daily,
        totals: Object.assign(base.totals, raw.totals || {}),
        lastDay: raw.lastDay || null
    };
}
function saveAnalytics(a) { Storage.set(ANALYTICS_KEY, JSON.stringify(a)); }

function trackEvent(type, amount) {
    if (!DB || DB.settings.shareAnalytics === false) return;
    const inc = amount == null ? 1 : amount;
    const a = getAnalytics();
    const day = dayKey(Date.now());
    if (!a.daily[day]) a.daily[day] = { posts: 0, likes: 0, reports: 0, messages: 0, sessions: 0 };
    if (a.daily[day][type] === undefined) a.daily[day][type] = 0;
    a.daily[day][type] += inc;
    if (a.totals[type] === undefined) a.totals[type] = 0;
    a.totals[type] += inc;
    a.lastDay = day;

    const keys = Object.keys(a.daily).sort();
    while (keys.length > 30) delete a.daily[keys.shift()];
    saveAnalytics(a);
}

/* ============================================================================
   9. PROFANITY FILTER
   ============================================================================ */
const BAD_WORDS = [
    'fuck','fucker','fucking','shit','shitty','asshole','bitch','bastard','cunt','dick','piss','crap',
    'slut','whore','nigger','nigga','faggot','retard'
];
function censorText(text) {
    if (!text) return text;
    if (DB && DB.settings.filterLanguage === false) return text;
    let out = text;
    BAD_WORDS.forEach(word => {
        const re = new RegExp('\\b' + word + '\\b', 'gi');
        out = out.replace(re, m => {
            if (m.length <= 2) return m[0] + '*';
            return m[0] + '*'.repeat(Math.max(1, m.length - 2)) + m[m.length - 1];
        });
    });
    return out;
}

/* ============================================================================
   10. FEEDBACK UI — toasts, modals, sound, notifications
   ============================================================================ */
function showToast(message, type, duration) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast ' + (type || 'info');
    toast.textContent = message;
    container.appendChild(toast);
    const life = duration || 3200;
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        setTimeout(() => toast.remove(), 280);
    }, life);
}

let sharedAudioContext = null;
function playSound() {
    try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!sharedAudioContext) sharedAudioContext = new Ctx();
        if (sharedAudioContext.state === 'suspended') sharedAudioContext.resume();
        const osc = sharedAudioContext.createOscillator();
        const gain = sharedAudioContext.createGain();
        osc.connect(gain);
        gain.connect(sharedAudioContext.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        const now = sharedAudioContext.currentTime;
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } catch (_) { /* audio is optional */ }
}

function notify(title, body) {
    if (!DB || !DB.settings.notifications) return;
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try { new Notification(title, { body: body || '', silent: !DB.settings.sound }); } catch (_) {}
    if (DB.settings.sound) playSound();
}

/**
 * Render a modal. Returns the overlay element so callers can wire extra
 * handlers and remove the exact instance they created.
 */
function showModal(title, contentHtml, actions) {
    const container = document.getElementById('modalContainer');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

    const buttons = (actions || []).map((a, i) =>
        `<button class="btn ${a.class || 'btn-secondary'}" data-modal-act="${i}">${escapeHtml(a.label)}</button>`
    ).join('');

    overlay.innerHTML =
        `<div class="modal${arguments[3] ? ' legal' : ''}">` +
        `<h3>${escapeHtml(title)}</h3>${contentHtml}` +
        `<div class="modal-actions">${buttons}</div></div>`;

    (actions || []).forEach((a, i) => {
        const btn = overlay.querySelector(`[data-modal-act="${i}"]`);
        if (!btn) return;
        btn.onclick = () => {
            if (typeof a.onClick === 'function') a.onClick(overlay);
            if (a.close !== false) overlay.remove();
        };
    });

    container.appendChild(overlay);
    return overlay;
}

/* ============================================================================
   12. APPLICATION STATE
   ============================================================================ */
let currentUser = null;
let myPeerId = null;
let appInitialized = false;
let authInFlight = false;
let viewingUserId = null;

/* ============================================================================
   13. AUTHENTICATION
   ============================================================================ */
function pruneGuestAccounts() {
    const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
    const session = readSession();
    const activeGuestId = session ? session.userId : null;
    Object.keys(DB.users).forEach(id => {
        const u = DB.users[id];
        if (u && u.isGuest && id !== activeGuestId && (u.createdAt || 0) < cutoff) {
            delete DB.users[id];
            delete DB.reputation[id];
        }
    });
}

async function register() {
    if (authInFlight) return;

    const nickEl  = document.getElementById('regNick');
    const emailEl = document.getElementById('regEmail');
    const passEl  = document.getElementById('regPassword');
    const ageOk   = document.getElementById('regAgeCheck').checked;
    const termsOk = document.getElementById('regTermsCheck').checked;
    const button  = document.getElementById('regBtn');

    try {
        const nick  = nickEl.value.trim();
        const email = emailEl.value.trim().toLowerCase();
        const pass  = passEl.value;

        if (!nick || !email || !pass) throw new Error('Please fill in every field.');
        if (nick.length > 32) throw new Error('Nickname must be 32 characters or fewer.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Please enter a valid email address.');
        if (pass.length < 6) throw new Error('Password must be at least 6 characters.');
        if (!ageOk) throw new Error('You must confirm you are 12 years of age or older.');
        if (!termsOk) throw new Error('You must agree to the Terms of Service and Privacy Policy.');

        authInFlight = true;
        button.disabled = true;

        const exists = Object.keys(DB.users).some(id => {
            const u = DB.users[id];
            return u && !u.isGuest && u.email === email;
        });
        if (exists) throw new Error('That email is already registered on this device.');

        const credentials = await createPasswordRecord(pass);
        const user = Object.assign({
            id: uid('yp'),
            nick,
            email,
            createdAt: Date.now(),
            bio: '',
            isGuest: false,
            ageConfirmed: true,
            termsAcceptedAt: Date.now()
        }, credentials);

        DB.users[user.id] = user;
        if (DB.reputation[user.id] == null) DB.reputation[user.id] = 50;
        pruneGuestAccounts();

        const status = persist();
        if (status === 'quota') throw new Error('Device storage is full. Free some space and try again.');

        saveSession(user.id);
        trackEvent('sessions');
        initApp(user);

        if (status === 'memory') {
            showToast('Storage is blocked by the browser — your account will not survive a reload.', 'warning', 7000);
        } else {
            showToast('Account created. Welcome to YipYap!', 'success');
        }
    } catch (err) {
        console.error('[register]', err);
        showAuthError('regError', err && err.message ? err.message : 'Could not create the account.');
    } finally {
        authInFlight = false;
        if (button) button.disabled = false;
    }
}

async function login() {
    if (authInFlight) return;

    const emailEl = document.getElementById('loginEmail');
    const passEl  = document.getElementById('loginPassword');
    const button  = document.getElementById('loginBtn');

    try {
        const email = emailEl.value.trim().toLowerCase();
        const pass  = passEl.value;

        if (!email || !pass) throw new Error('Please enter your email and password.');
        if (!hasWebCrypto() && !window.isSecureContext) {
            showToast('Running without WebCrypto — sign-in still works but hashing is weaker.', 'warning', 5000);
        }

        authInFlight = true;
        button.disabled = true;

        const user = Object.keys(DB.users)
            .map(id => DB.users[id])
            .find(u => u && !u.isGuest && u.email === email);

        if (!user) throw new Error('No account found for that email on this device.');
        if (!user.passHash) throw new Error('This account has no password. Try a different login method.');

        const ok = await verifyPassword(pass, user);
        if (!ok) throw new Error('Incorrect password.');

        // Opportunistically upgrade legacy unsalted hashes to PBKDF2.
        if (user.passAlgo !== 'pbkdf2-sha256') {
            try {
                Object.assign(user, await createPasswordRecord(pass));
                persist();
            } catch (upgradeErr) {
                console.warn('[login] password upgrade skipped', upgradeErr);
            }
        }

        const status = persist();
        if (status === 'quota') throw new Error('Device storage is full. Free some space and try again.');

        saveSession(user.id);
        trackEvent('sessions');
        initApp(user);
    } catch (err) {
        console.error('[login]', err);
        showAuthError('loginError', err && err.message ? err.message : 'Could not sign in.');
    } finally {
        authInFlight = false;
        if (button) button.disabled = false;
    }
}

function loginAsGuest() {
    try {
        const user = {
            id: uid('guest'),
            nick: 'Guest' + Math.floor(Math.random() * 900 + 100),
            email: null,
            passHash: null,
            passAlgo: null,
            isGuest: true,
            createdAt: Date.now(),
            bio: ''
        };
        DB.users[user.id] = user;
        if (DB.reputation[user.id] == null) DB.reputation[user.id] = 40;
        pruneGuestAccounts();
        persist();
        saveSession(user.id);
        trackEvent('sessions');
        initApp(user);
        showToast('Signed in as a guest. Data stays on this device.', 'info', 4200);
    } catch (err) {
        console.error('[guest]', err);
        showToast('Could not start a guest session.', 'error');
    }
}

function logout() {
    showModal('Logout', '<p>Are you sure you want to log out?</p>', [
        { label: 'Cancel', class: 'btn-secondary' },
        { label: 'Logout', class: 'btn-danger', onClick: () => {
            flushPendingWork();
            clearSession();
            destroyNetworkPeers();
            location.reload();

}

function destroyNetworkPeers() {
    [directoryPeer, hostPeer, guestPeer].forEach(p => {
        try { if (p && !p.destroyed) p.destroy(); } catch (_) {}
    });
    directoryPeer = hostPeer = guestPeer = null;
    feedConn = null;
    guestConn = null;
    hostConnections = [];
    activeFeedConns = [];
}
