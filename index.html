<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YipYap | Chat app</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --bg-input: #2a2a2a;
            --text-normal: #ffffff;
            --text-muted: #8e8e8e;
            --text-link: #ff7300;
            --accent: #ff7300;
            --accent-hover: #e66e00;
            --success: #3ba55c;
            --danger: #ed4245;
            --warning: #faa61a;
            --border-color: #333333;
            --scrollbar-thumb: #2a2a2a;
            --scrollbar-track: #1a1a1a;
            --shadow: rgba(0,0,0,0.5);
            --gradient: linear-gradient(135deg, #ff8a00 0%, #ff5200 100%);
            --card-bg: rgba(255,255,255,0.03);
            --hover-bg: rgba(255,255,255,0.05);
            --base-font-size: 15px;
        }

        [data-theme="light"] {
            --bg-primary: #f9f9f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f0;
            --bg-input: #ffffff;
            --text-normal: #1a1a1a;
            --text-muted: #6b6b6b;
            --text-link: #e66e00;
            --accent: #ff7300;
            --accent-hover: #cc5c00;
            --border-color: #e0e0e0;
            --scrollbar-thumb: #cccccc;
            --scrollbar-track: #f0f0f0;
            --shadow: rgba(0,0,0,0.1);
            --card-bg: rgba(0,0,0,0.02);
            --hover-bg: rgba(0,0,0,0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-normal);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: var(--base-font-size);
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .hidden { display: none !important; }

        /* ---------- AUTH ---------- */
        .auth-wrapper {
            position: fixed; inset: 0; z-index: 1000;
            background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 20% 50%, rgba(255,115,0,0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(255,82,0,0.1) 0%, transparent 50%);
        }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px var(--shadow);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .auth-logo {
            text-align: center;
            font-size: 2.5rem; font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .auth-tagline { text-align: center; color: var(--text-muted); margin-bottom: 32px; font-size: 0.9rem; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-normal);
            font-size: 1rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,115,0,0.15); }

        .btn {
            padding: 12px 20px; border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--hover-bg); color: var(--text-normal); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-small { padding: 6px 12px; font-size: 0.8rem; }

        .auth-toggle { text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--text-muted); }
        .auth-toggle a { color: var(--accent); cursor: pointer; font-weight: 600; }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            width: 240px; min-width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            transition: transform 0.3s;
        }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }

        .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer; transition: background 0.2s, color 0.2s;
            color: var(--text-muted); font-size: 0.95rem; font-weight: 500;
            margin-bottom: 2px;
        }
        .nav-item:hover { background: var(--hover-bg); color: var(--text-normal); }
        .nav-item.active { background: var(--accent); color: white; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-badge {
            margin-left: auto; background: var(--danger); color: white;
            font-size: 0.7rem; font-weight: 700;
            padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center;
        }

        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); }
        .user-card {
            display: flex; align-items: center; gap: 10px;
            padding: 8px; border-radius: 8px; cursor: pointer;
            transition: background 0.2s;
        }
        .user-card:hover { background: var(--hover-bg); }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--gradient); color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
        }
        .avatar.sm { width: 28px; height: 28px; font-size: 0.75rem; }
        .avatar.lg { width: 80px; height: 80px; font-size: 1.8rem; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-status { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--text-muted); }

        /* ---------- MAIN ---------- */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }
        .main-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-secondary);
        }
        .main-title { font-size: 1.2rem; font-weight: 700; flex: 1; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .main-body { flex: 1; overflow-y: auto; padding: 24px; }

        .mobile-toggle { display: none; background: none; border: none; color: var(--text-normal); cursor: pointer; padding: 4px; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block; }
        }

        /* ---------- FEED ---------- */
        .feed-container { max-width: 680px; margin: 0 auto; }
        .post-composer {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .composer-row { display: flex; gap: 12px; }
        .composer-input {
            flex: 1; background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px 14px; color: var(--text-normal);
            font-size: 0.95rem; resize: none; outline: none; min-height: 44px; font-family: inherit;
            transition: border-color 0.2s;
        }
        .composer-input:focus { border-color: var(--accent); }
        .composer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }

        .post-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .post-card:hover { box-shadow: 0 4px 12px var(--shadow); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .post-author-info { flex: 1; min-width: 0; }
        .post-author { font-weight: 600; font-size: 0.95rem; }
        .post-time { font-size: 0.75rem; color: var(--text-muted); }
        .post-content { font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; word-wrap: break-word; }
        .post-actions { display: flex; gap: 16px; }
        .post-action {
            display: flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
            padding: 6px 10px; border-radius: 6px; transition: all 0.2s;
            background: none; border: none; font-family: inherit;
        }
        .post-action:hover { background: var(--hover-bg); color: var(--accent); }
        .post-action.liked { color: var(--accent); }
        .post-action svg { width: 18px; height: 18px; }
        .post-delete { margin-left: auto; color: var(--danger); opacity: 0.6; }
        .post-delete:hover { opacity: 1; }

        .attachment-bubble { margin-top: 8px; max-width: 300px; }
        .attachment-bubble img { width: 100%; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); }
        .attachment-bubble video { width: 100%; border-radius: 8px; border: 1px solid var(--border-color); }
        .attachment-bubble a { display: flex; align-items: center; gap: 8px; background: var(--bg-tertiary); padding: 10px; border-radius: 8px; color: var(--accent); text-decoration: none; font-size: 0.9rem; }
        .attachment-bubble a:hover { background: var(--hover-bg); }

        .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .comment { display: flex; gap: 8px; margin-bottom: 8px; }
        .comment-content { flex: 1; }
        .comment-author { font-weight: 600; font-size: 0.8rem; }
        .comment-text { font-size: 0.85rem; color: var(--text-normal); }
        .comment-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .comment-input {
            flex: 1; background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 8px 12px; color: var(--text-normal);
            font-size: 0.85rem; outline: none;
        }
        .comment-input:focus { border-color: var(--accent); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-text { font-size: 1.1rem; margin-bottom: 8px; }
        .empty-state-sub { font-size: 0.9rem; }

        /* ---------- ROOMS ---------- */
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1000px; margin: 0 auto; }
        .room-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; cursor: pointer;
            transition: all 0.2s; position: relative;
        }
        .room-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); }
        .room-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .room-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .room-name { font-weight: 700; font-size: 1rem; }
        .room-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; line-height: 1.4; }
        .room-meta { display: flex; gap: 12px; font-size: 0.75rem; color: var(--text-muted); }
        .room-meta span { display: flex; align-items: center; gap: 4px; }
        .room-private-badge { position: absolute; top: 12px; right: 12px; background: var(--warning); color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .room-host-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--success); color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-top: 4px; }

        .create-room-card {
            background: transparent; border: 2px dashed var(--border-color);
            border-radius: 12px; padding: 16px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 140px; color: var(--text-muted); transition: all 0.2s;
        }
        .create-room-card:hover { border-color: var(--accent); color: var(--accent); }
        .create-room-icon { font-size: 2rem; margin-bottom: 8px; }

        /* ---------- CHAT ---------- */
        .chat-view { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
        .chat-message { display: flex; gap: 10px; max-width: 75%; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .chat-message.self { align-self: flex-end; flex-direction: row-reverse; }
        .chat-bubble {
            background: var(--bg-tertiary); padding: 10px 14px; border-radius: 16px;
            font-size: 0.95rem; line-height: 1.4; word-wrap: break-word;
        }
        .chat-message.self .chat-bubble { background: var(--accent); color: white; }
        .chat-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        .chat-message.self .chat-meta { text-align: right; }
        .chat-author { font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; color: var(--accent); }

        .typing-indicator { padding: 4px 20px; font-size: 0.8rem; color: var(--text-muted); font-style: italic; height: 24px; }
        .typing-dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); margin: 0 1px; animation: typingBounce 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

        .chat-input-area {
            padding: 12px 20px; border-top: 1px solid var(--border-color);
            display: flex; gap: 10px; align-items: flex-end;
            background: var(--bg-secondary);
        }
        .chat-input-wrapper { flex: 1; position: relative; display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-input); }
        .chat-input {
            flex: 1; background: transparent; border: none;
            padding: 10px 40px 10px 14px; color: var(--text-normal);
            font-size: 0.95rem; outline: none; resize: none; min-height: 42px; max-height: 200px;
            font-family: inherit;
        }
        .chat-input:focus { outline: none; }
        .emoji-btn {
            position: absolute; right: 8px; bottom: 8px;
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 1.2rem; padding: 4px; border-radius: 4px;
        }
        .emoji-btn:hover { color: var(--text-normal); background: var(--hover-bg); }

        .emoji-picker {
            position: absolute; bottom: 50px; right: 0;
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; width: 300px;
            box-shadow: 0 8px 24px var(--shadow); z-index: 10;
        }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-height: 200px; overflow-y: auto; }
        .emoji-item { font-size: 1.5rem; cursor: pointer; padding: 4px; border-radius: 4px; text-align: center; transition: background 0.1s; }
        .emoji-item:hover { background: var(--hover-bg); }

        /* ---------- DMs ---------- */
        .dm-layout { display: flex; height: 100%; }
        .dm-list {
            width: 280px; border-right: 1px solid var(--border-color);
            background: var(--bg-secondary); overflow-y: auto;
        }
        .dm-list-header { padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 700; }
        .dm-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; transition: background 0.2s; }
        .dm-item:hover { background: var(--hover-bg); }
        .dm-item.active { background: var(--bg-tertiary); }
        .dm-item-info { flex: 1; min-width: 0; }
        .dm-item-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dm-item-last { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dm-chat { flex: 1; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .dm-list { display: none; } .dm-list.mobile-open { display: block; position: fixed; inset: 0; z-index: 40; width: 100%; } }

        /* ---------- PROFILE ---------- */
        .profile-container { max-width: 600px; margin: 0 auto; }
        .profile-header {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 16px; overflow: hidden; margin-bottom: 20px;
        }
        .profile-banner { height: 120px; background: var(--gradient); }
        .profile-info { padding: 20px; display: flex; gap: 16px; align-items: flex-end; margin-top: -40px; }
        .profile-details { flex: 1; margin-bottom: 0; }
        .profile-name { font-size: 1.3rem; font-weight: 700; }
        .profile-email { color: var(--text-muted); font-size: 0.85rem; }
        .profile-stats { display: flex; gap: 20px; margin-top: 16px; }
        .stat { text-align: center; }
        .stat-num { font-weight: 700; font-size: 1.1rem; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); }
        .profile-edit-row { display: flex; gap: 8px; margin-top: 16px; }

        /* ---------- SETTINGS ---------- */
        .settings-container { max-width: 600px; margin: 0 auto; }
        .settings-section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .settings-section h3 { margin-bottom: 16px; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .setting-info div:first-child { font-weight: 600; font-size: 0.95rem; }
        .setting-info div:last-child { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-tertiary); transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* ---------- HOST PANEL ---------- */
        .host-panel {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto;
        }
        .host-panel h3 { margin-bottom: 12px; }
        .host-panel p { color: var(--text-muted); margin-bottom: 16px; font-size: 0.9rem; }
        .room-id-display {
            background: var(--bg-tertiary); padding: 12px; border-radius: 8px;
            font-family: monospace; font-size: 1.1rem; text-align: center;
            margin: 12px 0; cursor: pointer; transition: background 0.2s;
        }
        .room-id-display:hover { background: var(--bg-input); }

        /* ---------- TOAST ---------- */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px 16px; color: var(--text-normal);
            box-shadow: 0 4px 12px var(--shadow); min-width: 250px; max-width: 400px;
            animation: slideIn 0.3s ease; font-size: 0.9rem;
            display: flex; align-items: center; gap: 10px;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--accent); }
        .toast.warning { border-left: 4px solid var(--warning); }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.2s;
        }
        .modal {
            background: var(--bg-secondary); border-radius: 16px;
            padding: 24px; width: 100%; max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
        }
        .modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
        .checkbox-row input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
        .checkbox-row label { cursor: pointer; font-size: 0.9rem; }

        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-icon:hover { background: var(--hover-bg); color: var(--text-normal); }
        .btn-icon svg { width: 18px; height: 18px; }

        .spinner { width: 20px; height: 20px; border: 2px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.3s; }
    </style>
</head>

    <script>
    // ========== STATE ==========
    const DB_KEY = 'yipyap_db_v2';
    const SESSION_KEY = 'yipyap_session';
    const SETTINGS_KEY = 'yipyap_settings';

    let db = { users: {}, posts: [], rooms: {}, dms: {}, following: {}, notifications: [] };
    let session = null;
    let settings = {
        darkMode: true,
        fontSize: 'medium',
        soundOn: true,
        showTyping: true,
        readReceipts: true,
        dmPrivacy: 'everyone'
    };
    let peer = null;
    let connections = {};
    let activeView = 'feed';
    let activeRoom = null;
    let activeDM = null;
    let typingTimeout = null;
    let emojiPickerOpen = false;
    let isHost = false;
    let hostRoomId = null;
    let joinedRooms = new Set();
    let typingUsers = {};
    
    let currentChatAttachment = null;
    let currentPostAttachment = null;

    // ========== CRYPTO ==========
    async function hashPassword(password) {
        const enc = new TextEncoder();
        const buf = await crypto.subtle.digest('SHA-256', enc.encode(password));
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    async function deriveKey(secret) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: enc.encode('yipyap_salt'), iterations: 1000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function encryptMsg(text, key) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
        return btoa(String.fromCharCode(...iv) + String.fromCharCode(...new Uint8Array(cipher)));
    }

    async function decryptMsg(cipherB64, key) {
        try {
            const data = Uint8Array.from(atob(cipherB64), c => c.charCodeAt(0));
            const iv = data.slice(0, 12);
            const cipher = data.slice(12);
            const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
            return new TextDecoder().decode(dec);
        } catch(e) { return '[Decryption Error]'; }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.toString()
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ========== STORAGE ==========
    function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function loadDB() {
        try { db = JSON.parse(localStorage.getItem(DB_KEY)) || { users: {}, posts: [], rooms: {}, dms: {}, following: {}, notifications: [] }; }
        catch { db = { users: {}, posts: [], rooms: {}, dms: {}, following: {}, notifications: [] }; }
    }
    function saveSession() { if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
    function loadSession() {
        try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; }
        return session;
    }
    function clearSession() { localStorage.removeItem(SESSION_KEY); }
    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    function loadSettings() {
        try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || settings; } catch {}
    }

    // ========== TOAST ==========
    function showToast(message, type = 'info', duration = 3000) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
        toast.innerHTML = `<span style="font-weight:bold;font-size:1.1rem;">${icons[type] || ''}</span> ${escapeHtml(message)}`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, duration);
    }

    // ========== MODAL ==========
    function showModal(title, content, actions = []) {
        const container = document.getElementById('modalContainer');
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        let actionsHtml = actions.map((a, i) => `<button class="btn ${a.class || 'btn-secondary'}" data-action="${i}">${a.label}</button>`).join('');
        overlay.innerHTML = `
            <div class="modal">
                <h3>${escapeHtml(title)}</h3>
                ${content}
                <div class="modal-actions">${actionsHtml}</div>
            </div>`;
        actions.forEach((a, i) => {
            overlay.querySelector(`[data-action="${i}"]`).onclick = () => { if(a.onClick) a.onClick(overlay); if (a.close !== false) overlay.remove(); };
        });
        container.appendChild(overlay);
    }
    function closeModal() { document.querySelector('.modal-overlay')?.remove(); }

    // ========== AUTH ==========
    function showLogin() {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('guestForm').classList.add('hidden');
        document.getElementById('authError').style.display = 'none';
    }
    function showRegister() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('guestForm').classList.add('hidden');
        document.getElementById('authError').style.display = 'none';
    }
    function showGuestLogin() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('guestForm').classList.remove('hidden');
        document.getElementById('authError').style.display = 'none';
    }
    function showAuthError(msg) {
        const el = document.getElementById('authError');
        el.textContent = msg;
        el.style.display = 'block';
    }

    async function login() {
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const pass = document.getElementById('loginPassword').value;
        if (!email || !pass) return showAuthError('Please fill in all fields');
        const user = Object.values(db.users).find(u => u.email === email);
        if (!user) return showAuthError('No account found with that email');
        const hash = await hashPassword(pass);
        if (user.passwordHash !== hash) return showAuthError('Incorrect password');
        session = { userId: user.id, nickname: user.nickname, email: user.email, isGuest: false };
        saveSession();
        startApp();
    }

    async function register() {
        const nick = document.getElementById('regNick').value.trim();
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const pass = document.getElementById('regPassword').value;
        if (!nick || !email || !pass) return showAuthError('Please fill in all fields');
        if (pass.length < 6) return showAuthError('Password must be at least 6 characters');
        if (Object.values(db.users).some(u => u.email === email)) return showAuthError('Email already registered');
        const hash = await hashPassword(pass);
        const id = 'u_' + Date.now() + Math.random().toString(36).slice(2, 8);
        db.users[id] = { id, nickname: nick, email, passwordHash: hash, createdAt: Date.now(), bio: '' };
        if (!db.following[id]) db.following[id] = [];
        saveDB();
        session = { userId: id, nickname: nick, email, isGuest: false };
        saveSession();
        startApp();
    }

    function loginAsGuest() {
        const nick = document.getElementById('guestNick').value.trim() || 'Guest' + Math.floor(Math.random() * 1000);
        session = { userId: 'guest_' + Date.now(), nickname: nick, email: null, isGuest: true };
        saveSession();
        startApp();
    }

    function logout() {
        showModal('Logout', '<p>Are you sure you want to log out?</p>', [
            { label: 'Cancel', class: 'btn-secondary' },
            { label: 'Logout', class: 'btn-danger', onClick: () => {
                if (peer) { try { peer.destroy(); } catch{} }
                clearSession();
                session = null;
                location.reload();
            }}
        ]);
    }

    // ========== APP INIT ==========
    async function startApp() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('app').style.display = 'flex';

        document.getElementById('sidebarAvatar').textContent = session.nickname.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = session.nickname;
        document.getElementById('sidebarStatus').innerHTML = session.isGuest 
            ? '<span class="status-dot" style="background:var(--warning)"></span>Guest' 
            : '<span class="status-dot online"></span>Online';

        applySettings();
        initPeer();
        switchView('feed');
    }

    function initPeer() {
        const peerId = session.isGuest ? 'guest_' + session.userId : session.userId;
        try {
            peer = new Peer(peerId, { debug: 1 });
            peer.on('open', (id) => {
                console.log('Peer connected:', id);
                showToast('Connected to network', 'success');
                if (activeView === 'rooms') renderRooms();
            });
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'unavailable-id') {
                    showToast('ID in use, reconnecting...', 'warning');
                    setTimeout(() => { try { peer.reconnect(); } catch{} }, 1000);
                } else if (err.type === 'peer-unavailable') {
                    showToast('User not found or offline', 'warning');
                } else {
                    showToast('Connection error: ' + err.type, 'error');
                }
            });
            peer.on('disconnected', () => {
                console.log('Peer disconnected, attempting reconnect...');
                try { peer.reconnect(); } catch(e) {}
            });
        } catch(e) {
            console.error('Peer init failed:', e);
            showToast('Failed to connect to network', 'error');
        }
    }

    function handleIncomingConnection(conn) {
        conn.on('open', () => {
            connections[conn.peer] = conn;
            conn.on('data', (data) => handleIncomingData(conn, data));
            conn.on('close', () => { delete connections[conn.peer]; });
        });
        conn.on('error', () => { delete connections[conn.peer]; });
    }

    async function handleIncomingData(conn, data) {
        if (!data || !data.type) return;
        
        switch(data.type) {
            case 'chat':
                displayChatMessage(conn.peer, data.text, false, data.timestamp, true, data.attachment);
                break;
            case 'typing':
                if (settings.showTyping) showTypingIndicator(conn.peer, true);
                break;
            case 'stop_typing':
                showTypingIndicator(conn.peer, false);
                break;
            case 'follow':
                if (!db.following[session.userId]) db.following[session.userId] = [];
                showToast(`${data.nickname} is now following you`, 'info');
                addNotification(`${data.nickname} started following you`);
                break;
            case 'like':
                if (data.postId) {
                    const post = db.posts.find(p => p.id === data.postId);
                    if (post) {
                        if (!post.likes) post.likes = [];
                        if (!post.likes.includes(data.userId)) {
                            post.likes.push(data.userId);
                            saveDB();
                            if (activeView === 'feed' || activeView === 'myposts') renderFeed();
                        }
                        addNotification(`${data.nickname} liked your post`);
                    }
                }
                break;
            case 'comment':
                if (data.postId) {
                    const post = db.posts.find(p => p.id === data.postId);
                    if (post) {
                        if (!post.comments) post.comments = [];
                        post.comments.push({ author: data.userId, nickname: data.nickname, text: data.text, timestamp: Date.now() });
                        saveDB();
                        if (activeView === 'feed' || activeView === 'myposts') renderFeed();
                        addNotification(`${data.nickname} commented on your post`);
                    }
                }
                break;
        }
    }

    // ========== VIEW SWITCHING ==========
    function switchView(view) {
        activeView = view;
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.toggle('active', item.dataset.view === view);
        });
        document.getElementById('sidebar').classList.remove('open');

        const titles = { feed: 'Global Feed', rooms: 'Chat Rooms', dms: 'Direct Messages', myposts: 'My Posts', following: 'Following', profile: 'Profile', host: 'Host Panel', settings: 'Settings' };
        document.getElementById('mainTitle').textContent = titles[view] || view;
        document.getElementById('headerActions').innerHTML = '';

        switch(view) {
            case 'feed': renderFeed(); break;
            case 'rooms': renderRooms(); break;
            case 'dms': renderDMs(); break;
            case 'myposts': renderMyPosts(); break;
            case 'following': renderFollowing(); break;
            case 'profile': renderProfile(); break;
            case 'host': renderHostPanel(); break;
            case 'settings': renderSettings(); break;
        }
    }

    // ========== ATTACHMENTS ==========
    function handleFileSelect(event, context) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) { // 5MB limit for P2P
            showToast('File too large (max 5MB)', 'error');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const attachment = { name: file.name, type: file.type, dataUrl: e.target.result };
            
            if (context === 'chat') {
                currentChatAttachment = attachment;
                const previewEl = document.getElementById('chatAttPreview');
                if (previewEl) {
                    previewEl.innerHTML = getAttachmentHtml(attachment, true, 'chat');
                }
            } else if (context === 'post') {
                currentPostAttachment = attachment;
                const previewEl = document.getElementById('postAttPreview');
                if (previewEl) {
                    previewEl.innerHTML = getAttachmentHtml(attachment, true, 'post');
                }
            }
        };
        reader.readAsDataURL(file);
        event.target.value = ''; // Reset input
    }

    function getAttachmentHtml(att, isPreview = false, context = 'chat') {
        if (!att) return '';
        let mediaHtml = '';
        if (att.type.startsWith('image/')) {
            mediaHtml = `<img src="${att.dataUrl}" alt="${escapeHtml(att.name)}">`;
        } else if (att.type.startsWith('video/')) {
            mediaHtml = `<video controls><source src="${att.dataUrl}" type="${att.type}"></video>`;
        } else {
            mediaHtml = `<a href="${att.dataUrl}" download="${escapeHtml(att.name)}">📄 ${escapeHtml(att.name)}</a>`;
        }

        if (isPreview) {
            return `<div class="attachment-bubble" style="margin-bottom: 8px;">
                ${mediaHtml}
                <button class="btn-icon" onclick="clearAttachment('${context}')" style="position: relative; width: 100%; background: var(--danger); color: white; border-radius: 4px; margin-top: 4px; padding: 4px;">Remove</button>
            </div>`;
        }
        return `<div class="attachment-bubble">${mediaHtml}</div>`;
    }

    function clearAttachment(context) {
        if (context === 'chat') {
            currentChatAttachment = null;
            document.getElementById('chatAttPreview').innerHTML = '';
        } else if (context === 'post') {
            currentPostAttachment = null;
            document.getElementById('postAttPreview').innerHTML = '';
        }
    }

    // ========== FEED ==========
    function renderFeed() {
        const body = document.getElementById('mainBody');
        let posts = [...db.posts].sort((a, b) => b.timestamp - a.timestamp);
        
        body.innerHTML = `
            <div class="feed-container">
                <div class="post-composer">
                    <div class="composer-row">
                        <div class="avatar sm">${session.nickname.charAt(0).toUpperCase()}</div>
                        <textarea class="composer-input" id="postInput" placeholder="Share something with the world..." rows="2"></textarea>
                    </div>
                    <div id="postAttPreview" style="margin-top: 12px;"></div>
                    <div class="composer-actions">
                        <button class="btn-icon" onclick="document.getElementById('postFileInput').click()" title="Attach File">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                        </button>
                        <input type="file" id="postFileInput" style="display:none" onchange="handleFileSelect(event, 'post')">
                        <button class="btn btn-primary btn-small" onclick="createPost()">Post</button>
                    </div>
                </div>
                <div id="postsList"></div>
            </div>`;

        const listEl = document.getElementById('postsList');
        if (posts.length === 0) {
            listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">No posts yet</div><div class="empty-state-sub">Be the first to share something!</div></div>`;
            return;
        }

        listEl.innerHTML = posts.map(p => renderPostCard(p)).join('');
        listEl.querySelectorAll('[data-post-id]').forEach(el => {
            const id = el.dataset.postId;
            el.querySelector('.like-btn')?.addEventListener('click', () => toggleLike(id));
            el.querySelector('.comment-btn')?.addEventListener('click', () => toggleComments(id));
            el.querySelector('.delete-btn')?.addEventListener('click', () => deletePost(id));
            el.querySelector('.comment-send')?.addEventListener('click', () => addComment(id));
            el.querySelector('.comment-input')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') addComment(id); });
        });
    }

    function renderPostCard(p) {
        const isLiked = p.likes && p.likes.includes(session.userId);
        const canDelete = p.authorId === session.userId;
        const time = new Date(p.timestamp).toLocaleString();
        const commentsHtml = p.comments && p.comments.length > 0 ? p.comments.map(c => `
            <div class="comment">
                <div class="avatar sm">${escapeHtml(c.nickname.charAt(0).toUpperCase())}</div>
                <div class="comment-content">
                    <div class="comment-author">${escapeHtml(c.nickname)}</div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            </div>`).join('') : '';

        return `
            <div class="post-card" data-post-id="${p.id}">
                <div class="post-header">
                    <div class="avatar sm">${escapeHtml(p.author.charAt(0).toUpperCase())}</div>
                    <div class="post-author-info">
                        <div class="post-author">${escapeHtml(p.author)}</div>
                        <div class="post-time">${time}</div>
                    </div>
                    ${canDelete ? `<button class="btn-icon delete-btn" title="Delete"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>` : ''}
                </div>
                <div class="post-content">${escapeHtml(p.content)}</div>
                ${p.attachment ? getAttachmentHtml(p.attachment) : ''}
                <div class="post-actions">
                    <button class="post-action like-btn ${isLiked ? 'liked' : ''}">
                        <svg viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                        ${p.likes ? p.likes.length : 0}
                    </button>
                    <button class="post-action comment-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        ${p.comments ? p.comments.length : 0}
                    </button>
                </div>
                <div class="comments-section hidden">
                    ${commentsHtml}
                    <div class="comment-input-row">
                        <input type="text" class="comment-input" placeholder="Write a comment...">
                        <button class="btn btn-primary btn-small comment-send">Send</button>
                    </div>
                </div>
            </div>`;
    }

    function createPost() {
        const input = document.getElementById('postInput');
        const text = input.value.trim();
        if (!text && !currentPostAttachment) return;
        const post = {
            id: 'p_' + Date.now() + Math.random().toString(36).slice(2, 6),
            authorId: session.userId,
            author: session.nickname,
            content: text,
            attachment: currentPostAttachment,
            timestamp: Date.now(),
            likes: [], comments: []
        };
        db.posts.unshift(post);
        saveDB();
        currentPostAttachment = null;
        renderFeed();
        showToast('Posted!', 'success');
    }

    function toggleLike(postId) {
        const post = db.posts.find(p => p.id === postId);
        if (!post) return;
        if (!post.likes) post.likes = [];
        const idx = post.likes.indexOf(session.userId);
        if (idx >= 0) post.likes.splice(idx, 1);
        else { post.likes.push(session.userId); notifyPostAuthor(post, 'like'); }
        saveDB();
        renderFeed();
    }

    function toggleComments(postId) {
        const card = document.querySelector(`[data-post-id="${postId}"]`);
        if (card) card.querySelector('.comments-section').classList.toggle('hidden');
    }

    function addComment(postId) {
        const card = document.querySelector(`[data-post-id="${postId}"]`);
        if (!card) return;
        const input = card.querySelector('.comment-input');
        const text = input.value.trim();
        if (!text) return;
        const post = db.posts.find(p => p.id === postId);
        if (!post) return;
        if (!post.comments) post.comments = [];
        post.comments.push({ author: session.userId, nickname: session.nickname, text, timestamp: Date.now() });
        saveDB();
        notifyPostAuthor(post, 'comment', text);
        renderFeed();
        setTimeout(() => toggleComments(postId), 100);
    }

    function deletePost(postId) {
        showModal('Delete Post', '<p>Are you sure you want to delete this post?</p>', [
            { label: 'Cancel', class: 'btn-secondary' },
            { label: 'Delete', class: 'btn-danger', onClick: () => {
                db.posts = db.posts.filter(p => p.id !== postId);
                saveDB();
                if (activeView === 'feed') renderFeed();
                else renderMyPosts();
                showToast('Post deleted', 'success');
            }}
        ]);
    }

    function notifyPostAuthor(post, type, commentText) {
        if (post.authorId === session.userId) return;
        const conn = connections[post.authorId];
        if (conn && conn.open) {
            conn.send({ type, postId: post.id, userId: session.userId, nickname: session.nickname, text: commentText });
        }
    }

    // ========== MY POSTS ==========
    function renderMyPosts() {
        const body = document.getElementById('mainBody');
        const posts = db.posts.filter(p => p.authorId === session.userId).sort((a, b) => b.timestamp - a.timestamp);
        
        body.innerHTML = `<div class="feed-container"><div id="myPostsList"></div></div>`;
        const listEl = document.getElementById('myPostsList');
        if (posts.length === 0) {
            listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📄</div><div class="empty-state-text">You haven't posted yet</div><div class="empty-state-sub">Share your thoughts on the Global Feed!</div></div>`;
            return;
        }
        listEl.innerHTML = posts.map(p => renderPostCard(p)).join('');
        listEl.querySelectorAll('[data-post-id]').forEach(el => {
            const id = el.dataset.postId;
            el.querySelector('.like-btn')?.addEventListener('click', () => toggleLike(id));
            el.querySelector('.comment-btn')?.addEventListener('click', () => toggleComments(id));
            el.querySelector('.delete-btn')?.addEventListener('click', () => deletePost(id));
            el.querySelector('.comment-send')?.addEventListener('click', () => addComment(id));
            el.querySelector('.comment-input')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') addComment(id); });
        });
    }

    // ========== ROOMS ==========
    function renderRooms() {
        const body = document.getElementById('mainBody');
        const rooms = Object.values(db.rooms);
        
        body.innerHTML = `
            <div class="rooms-grid">
                <div class="create-room-card" onclick="showCreateRoomModal()">
                    <div class="create-room-icon">+</div>
                    <div>Create Room</div>
                </div>
                ${rooms.length === 0 
                    ? '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">🏠</div><div class="empty-state-text">No rooms yet</div><div class="empty-state-sub">Create or join a room to start chatting!</div></div>'
                    : rooms.map(r => renderRoomCard(r)).join('')
                }
            </div>`;

        body.querySelectorAll('[data-room-id]').forEach(el => {
            el.addEventListener('click', () => joinRoom(el.dataset.roomId));
        });
    }

    function renderRoomCard(r) {
        const isHost = r.hostId === session.userId;
        const isPrivate = r.isPrivate;
        const icon = r.icon || '💬';
        return `
            <div class="room-card" data-room-id="${r.id}">
                ${isPrivate ? '<div class="room-private-badge">Private</div>' : ''}
                <div class="room-card-header">
                    <div class="room-icon">${icon}</div>
                    <div>
                        <div class="room-name">${escapeHtml(r.name)}</div>
                        ${isHost ? '<div class="room-host-badge">★ You host this</div>' : ''}
                    </div>
                </div>
                <div class="room-desc">${escapeHtml(r.description || 'No description')}</div>
                <div class="room-meta">
                    <span>👤 ${escapeHtml(r.hostNick)}</span>
                    <span>🆔 ${r.id.slice(0, 8)}...</span>
                </div>
            </div>`;
    }

    function showCreateRoomModal() {
        showModal('Create Room', `
            <div class="form-group">
                <label>Room Name</label>
                <input type="text" id="newRoomName" placeholder="Awesome Chat Room">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="newRoomDesc" placeholder="What's this room about?">
            </div>
            <div class="form-group">
                <label>Icon (emoji)</label>
                <input type="text" id="newRoomIcon" placeholder="💬" maxlength="2">
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="newRoomPrivate">
                <label for="newRoomPrivate">Private room (requires password to join)</label>
            </div>
            <div class="form-group" id="passwordGroup" style="display:none;">
                <label>Room Password</label>
                <input type="password" id="newRoomPass" placeholder="Room password">
            </div>`, [
            { label: 'Cancel', class: 'btn-secondary' },
            { label: 'Create', class: 'btn-primary', onClick: () => createRoom() }
        ]);
        document.getElementById('newRoomPrivate').onchange = (e) => {
            document.getElementById('passwordGroup').style.display = e.target.checked ? 'block' : 'none';
        };
    }

    async function createRoom() {
        const name = document.getElementById('newRoomName').value.trim();
        const desc = document.getElementById('newRoomDesc').value.trim();
        const icon = document.getElementById('newRoomIcon').value.trim() || '💬';
        const isPrivate = document.getElementById('newRoomPrivate').checked;
        const pass = document.getElementById('newRoomPass').value;
        
        if (!name) { showToast('Please enter a room name', 'error'); return; }
        if (isPrivate && !pass) { showToast('Private rooms need a password', 'error'); return; }

        const roomId = 'room_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const encKey = isPrivate ? await deriveKey(pass) : null;
        
        db.rooms[roomId] = {
            id: roomId,
            name, description: desc, icon,
            hostId: session.userId,
            hostNick: session.nickname,
            isPrivate, 
            passwordHash: isPrivate ? await hashPassword(pass) : null,
            createdAt: Date.now()
        };
        saveDB();
        isHost = true;
        hostRoomId = roomId;
        joinedRooms.add(roomId);
        closeModal();
        showToast('Room created!', 'success');
        openRoomChat(roomId);
    }

    function joinRoom(roomId) {
        const room = db.rooms[roomId];
        if (!room) { showToast('Room not found', 'error'); return; }
        
        if (room.isPrivate) {
            showModal('Join Private Room', `
                <p>This room requires a password.</p>
                <div class="form-group">
                    <label>Room Password</label>
                    <input type="password" id="joinRoomPass" placeholder="Enter password">
                </div>`, [
                { label: 'Cancel', class: 'btn-secondary' },
                { label: 'Join', class: 'btn-primary', onClick: async () => {
                    const pass = document.getElementById('joinRoomPass').value;
                    const hash = await hashPassword(pass);
                    if (hash !== room.passwordHash) { showToast('Incorrect password', 'error'); return; }
                    joinedRooms.add(roomId);
                    closeModal();
                    openRoomChat(roomId);
                }}
            ]);
        } else {
            joinedRooms.add(roomId);
            openRoomChat(roomId);
        }
    }

    function openRoomChat(roomId) {
        activeRoom = roomId;
        const room = db.rooms[roomId];
        if (!room) return;
        
        document.getElementById('mainTitle').textContent = room.icon + ' ' + room.name;
        document.getElementById('headerActions').innerHTML = `<button class="btn btn-secondary btn-small" onclick="leaveRoom()">← Back to Rooms</button>`;
        
        const body = document.getElementById('mainBody');
        body.innerHTML = `
            <div class="chat-view">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator" id="typingIndicator"></div>
                <div class="chat-input-area">
                    <button class="btn-icon" onclick="document.getElementById('chatFileInput').click()" title="Attach File">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                    </button>
                    <input type="file" id="chatFileInput" style="display:none" onchange="handleFileSelect(event, 'chat')">
                    <div class="chat-input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
                        <button class="emoji-btn" onclick="toggleEmojiPicker(event)">😊</button>
                    </div>
                    <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
                </div>
                <div id="chatAttPreview" style="padding: 0 20px 12px 20px; border-top: 1px solid var(--border-color); background: var(--bg-secondary);"></div>
            </div>`;

        const input = document.getElementById('chatInput');
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
            sendTypingIndicator();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
        });

        renderChatHistory(roomId);
    }

    function renderChatHistory(roomId) {
        const room = db.rooms[roomId];
        if (!room || !room.messages) return;
        const el = document.getElementById('chatMessages');
        if (!el) return;
        room.messages.forEach(m => {
            displayChatMessage(m.author, m.text, m.authorId === session.userId, m.timestamp, false, m.attachment);
        });
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text && !currentChatAttachment) return;
        
        const room = db.rooms[activeRoom];
        if (!room) return;
        
        let msgText = text;
        let encText = null;
        if (room.isPrivate && room.encKey) {
            encText = await encryptMsg(text, room.encKey);
        }

        const msg = { author: session.nickname, authorId: session.userId, text: msgText, encText, attachment: currentChatAttachment, timestamp: Date.now() };
        if (!room.messages) room.messages = [];
        room.messages.push(msg);
        saveDB();

        displayChatMessage(session.nickname, text, true, msg.timestamp, true, currentChatAttachment);
        input.value = '';
        input.style.height = 'auto';
        clearAttachment('chat');

        const payload = { type: 'chat', text: room.isPrivate ? encText : text, timestamp: msg.timestamp, roomId: activeRoom, attachment: msg.attachment };
        Object.values(connections).forEach(conn => {
            if (conn.open) {
                try { conn.send(payload); } catch(e) {}
            }
        });
    }

    function displayChatMessage(author, text, isSelf, timestamp, animate = true, attachment = null) {
        const el = document.getElementById('chatMessages');
        if (!el) return;
        const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const msgEl = document.createElement('div');
        msgEl.className = `chat-message ${isSelf ? 'self' : ''}`;
        if (!animate) msgEl.style.animation = 'none';
        
        let contentHtml = `<div class="chat-bubble">${escapeHtml(text)}`;
        if (attachment) {
            contentHtml += getAttachmentHtml(attachment);
        }
        contentHtml += `</div>`;

        msgEl.innerHTML = `
            <div class="avatar sm">${escapeHtml(author.charAt(0).toUpperCase())}</div>
            <div>
                ${!isSelf ? `<div class="chat-author">${escapeHtml(author)}</div>` : ''}
                ${contentHtml}
                <div class="chat-meta">${time}</div>
            </div>`;
        el.appendChild(msgEl);
        el.scrollTop = el.scrollHeight;
    }

    function sendTypingIndicator() {
        if (!settings.showTyping || !activeRoom) return;
        clearTimeout(typingTimeout);
        Object.values(connections).forEach(conn => {
            if (conn.open) { try { conn.send({ type: 'typing', roomId: activeRoom }); } catch(e) {} }
        });
        typingTimeout = setTimeout(() => {
            Object.values(connections).forEach(conn => {
                if (conn.open) { try { conn.send({ type: 'stop_typing', roomId: activeRoom }); } catch(e) {} }
            });
        }, 2000);
    }

    function showTypingIndicator(peerId, isTyping) {
        const el = document.getElementById('typingIndicator');
        if (!el) return;
        if (isTyping) {
            el.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
        } else {
            el.innerHTML = '';
        }
    }

    function leaveRoom() {
        activeRoom = null;
        switchView('rooms');

    function startDM() {

        activeDM = peerId;
        if (!db.dms[session.userId]) db.dms[session.userId] = [];
        let dm = db.dms[session.userId].find(d => d.peerId === peerId);
        if (!dm) {

        const chatEl = document.getElementById('dmChat');

                </div>
            </div>
            <div class="chat-messages" id="dmMessages"></div>
            <div class="chat-input-area">
                <button class="btn-icon" onclick="document.getElementById('dmFileInput').click()" title="Attach File">

                    <textarea class="chat-input" id="dmInput" placeholder="Type a message..." rows="1"></textarea>
                    <button class="emoji-btn" onclick="toggleEmojiPicker(event)">😊</button>
                </div>

            </div>
            <div id="chatAttPreview" style="padding: 0 20px 12px 20px; border-top: 1px solid var(--border-color); background: var(--bg-secondary);"></div>`;

        const input = document.getElementById('dmInput');
        input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDM(); } });

        const msgsEl = document.getElementById('dmMessages');
        dm.messages.forEach(m => {
            const msgEl = document.createElement('div');
            msgEl.className = `chat-message ${m.isSelf ? 'self' : ''}`;
            msgEl.style.animation = 'none';
            
            let contentHtml = `<div class="chat-bubble">${escapeHtml(m.text)}`;
            if (m.attachment) contentHtml += getAttachmentHtml(m.attachment);
            contentHtml += `</div>`;

            msgEl.innerHTML = `
                <div class="avatar sm">${escapeHtml(m.author.charAt(0).toUpperCase())}</div>
                <div>
                    ${contentHtml}
                    <div class="chat-meta">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                </div>`;
            msgsEl.appendChild(msgEl);
        });
        msgsEl.scrollTop = msgsEl.scrollHeight;

        if (!connections[peerId] || !connections[peerId].open) {
            connectToPeer(peerId, dm.nickname);
        }
    }

    function connectToPeer(peerId, nickname) {
        if (!peer || peer.destroyed) return;
        if (connections[peerId] && connections[peerId].open) return;
        const conn = peer.connect(peerId, { reliable: true });
        conn.on('open', () => {
            connections[peerId] = conn;
            conn.on('data', (data) => {
                if (data.type === 'chat' && data.dmAuthor) {
                    receiveDM(peerId, data.dmAuthor, data.text, data.timestamp, data.attachment);
                }
            });
            conn.on('close', () => { delete connections[peerId]; });
            showToast('Connected to ' + (nickname || peerId), 'success');
        });
        conn.on('error', () => { showToast('Connection failed: user may be offline', 'error'); });
    }

    function sendDM() {
        const input = document.getElementById('dmInput');
        const text = input.value.trim();
        if (!text && !currentChatAttachment) return;
        
        const dm = db.dms[session.userId]?.find(d => d.peerId === activeDM);
        if (!dm) return;

        const msg = { author: session.nickname, isSelf: true, text, attachment: currentChatAttachment, timestamp: Date.now() };
        dm.messages.push(msg);
        dm.lastMessage = text;
        saveDB();

        const conn = connections[activeDM];
        if (conn && conn.open) {
            conn.send({ type: 'chat', dmAuthor: session.nickname, text, timestamp: msg.timestamp, attachment: currentChatAttachment });
        } else {
            showToast('User is offline, message saved locally', 'warning');
            connectToPeer(activeDM, dm.nickname);
        }

        const msgsEl = document.getElementById('dmMessages');
        const msgEl = document.createElement('div');
        msgEl.className = 'chat-message self';
        
        let contentHtml = `<div class="chat-bubble">${escapeHtml(text)}`;
        if (currentChatAttachment) contentHtml += getAttachmentHtml(currentChatAttachment);
        contentHtml += `</div>`;

        msgEl.innerHTML = `
            <div class="avatar sm">${escapeHtml(session.nickname.charAt(0).toUpperCase())}</div>
            <div>
                ${contentHtml}
                <div class="chat-meta">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>`;
        msgsEl.appendChild(msgEl);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        
        input.value = '';
        input.style.height = 'auto';
        clearAttachment('chat');
    }

    function receiveDM(peerId, author, text, timestamp, attachment = null) {
        if (!db.dms[session.userId]) db.dms[session.userId] = [];
        let dm = db.dms[session.userId].find(d => d.peerId === peerId);
        if (!dm) {
            dm = { peerId, nickname: author, messages: [], lastMessage: '' };
            db.dms[session.userId].push(dm);
        }
        dm.messages.push({ author, isSelf: false, text, attachment, timestamp });
        dm.lastMessage = text;
        saveDB();

        if (activeDM === peerId) {
            const msgsEl = document.getElementById('dmMessages');
            if (msgsEl) {
                const msgEl = document.createElement('div');
                msgEl.className = 'chat-message';
                
                let contentHtml = `<div class="chat-bubble">${escapeHtml(text)}`;
                if (attachment) contentHtml += getAttachmentHtml(attachment);
                contentHtml += `</div>`;

                msgEl.innerHTML = `
                    <div class="avatar sm">${escapeHtml(author.charAt(0).toUpperCase())}</div>
                    <div>
                        <div class="chat-author">${escapeHtml(author)}</div>
                        ${contentHtml}
                        <div class="chat-meta">${new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>`;
                msgsEl.appendChild(msgEl);
                msgsEl.scrollTop = msgsEl.scrollHeight;
            }
        } else {
            showToast(`New message from ${author}`, 'info');
        }
    }

    function followUser() {
        const input = document.getElementById('followInput');
        const query = input.value.trim();
        if (!query) return;
        
        if (!db.following[session.userId]) db.following[session.userId] = [];
        if (db.following[session.userId].some(f => f.peerId === query)) {
            showToast('Already following', 'warning'); return;
        }
        
        const target = Object.values(db.users).find(u => u.id === query || u.nickname.toLowerCase() === query.toLowerCase());
        const peerId = target ? target.id : query;
        const nickname = target ? target.nickname : query;
        
        db.following[session.userId].push({ peerId, nickname });
        saveDB();
        
        const conn = connections[peerId];
        if (conn && conn.open) {
            conn.send({ type: 'follow', nickname: session.nickname });
        }
        
        input.value = '';
        renderFollowing();
        showToast(`Now following ${nickname}`, 'success');
    }

    function unfollowUser(peerId) {
        if (!db.following[session.userId]) return;
        db.following[session.userId] = db.following[session.userId].filter(f => f.peerId !== peerId);
        saveDB();
        renderFollowing();
        showToast('Unfollowed', 'info');
    }

                    </div>
                </div>

                <div class="settings-section">
                    <h3>Privacy</h3>
                    <div class="setting-row">
                        <div class="setting-info">
                            <div>Direct Messages</div>
                            <div>Who can send you direct messages</div>
                        </div>
                        <select onchange="updateSetting('dmPrivacy', this.value)" style="padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-normal); border-radius: 6px;">
                            <option value="everyone" ${settings.dmPrivacy === 'everyone' ? 'selected' : ''}>Everyone</option>
                            <option value="following" ${settings.dmPrivacy === 'following' ? 'selected' : ''}>Following Only</option>
                            <option value="none" ${settings.dmPrivacy === 'none' ? 'selected' : ''}>No One</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Data & Storage</h3>
                    <div class="setting-row">
                        <div class="setting-info">
                            <div>Clear Message History</div>
                            <div>Remove all local chat messages</div>
                        </div>
                        <button class="btn btn-secondary btn-small" onclick="clearChatHistory()">Clear</button>
                    </div>
                    <div class="setting-row">
                        <div class="setting-info">
                            <div>Clear All Data</div>
                            <div>Wipe all local data and log out</div>
                        </div>
                        <button class="btn btn-danger btn-small" onclick="clearAllData()">Wipe</button>
                    </div>
                </div>
            </div>
        `;
    }

    function updateSetting(key, value) {
        settings[key] = value;
        saveSettings();
        applySettings();
        if (key === 'darkMode') {
            showToast('Theme updated', 'success');
        }
    }

    function applySettings() {
        document.documentElement.setAttribute('data-theme', settings.darkMode ? 'dark' : 'light');
        const sizes = { small: '13px', medium: '15px', large: '17px' };
        document.documentElement.style.setProperty('--base-font-size', sizes[settings.fontSize] || '15px');
    }

    function clearChatHistory() {
        showModal('Clear Chat History', '<p>Are you sure you want to clear all DM and Room histories? This cannot be undone.</p>', [
            { label: 'Cancel', class: 'btn-secondary' },
            { label: 'Clear', class: 'btn-danger', onClick: () => {
                db.dms = {};
                if (db.rooms) {
                    Object.values(db.rooms).forEach(r => r.messages = []);
                }
                saveDB();
                showToast('Chat history cleared', 'success');
            }}
        ]);
    }

    function clearAllData() {
        showModal('Wipe All Data', '<p>This will permanently delete your account, posts, and all settings. Continue?</p>', [
            { label: 'Cancel', class: 'btn-secondary' },
            { label: 'Wipe Everything', class: 'btn-danger', onClick: () => {
                localStorage.clear();
                location.reload();
            }}
        ]);
    }

    // ========== NOTIFICATIONS ==========
    function addNotification(text) {
        db.notifications.push({ id: Date.now(), text, read: false, timestamp: Date.now() });
        saveDB();
    }

    // ========== MOBILE SIDEBAR ==========
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    // ========== INIT ==========
    function init() {
        loadDB();
        loadSettings();
        applySettings();
        
        if (loadSession()) { startApp(); }
        else { showLogin(); }

        document.getElementById('loginPassword')?.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        document.getElementById('regPassword')?.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
        document.getElementById('guestNick')?.addEventListener('keydown', e => { if (e.key === 'Enter') loginAsGuest(); });
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
