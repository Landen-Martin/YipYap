/* ============================================================================
   16. POST STORE HELPERS
   ============================================================================ */
function getPost(id) {
    for (let i = 0; i < DB.posts.length; i++) {
        if (DB.posts[i].id === id) return DB.posts[i];
    }
    return null;
}

function upsertPost(post) {
    const idx = DB.posts.findIndex(p => p.id === post.id);
    if (idx >= 0) DB.posts[idx] = post;
    else DB.posts.unshift(post);
    trimPosts();
}

function removePostById(id) {
    const idx = DB.posts.findIndex(p => p.id === id);
    if (idx < 0) return;
    const post = DB.posts[idx];
    DB.posts.splice(idx, 1);
    DB.likedPosts    = DB.likedPosts.filter(x => x !== id);
    DB.dislikedPosts = DB.dislikedPosts.filter(x => x !== id);
    DB.viewedPosts   = DB.viewedPosts.filter(x => x !== id);
    delete DB.reportsMade[id];
    if (post && post.attachment && post.attachment.id) {
        attachmentMemCache.delete(post.attachment.id);
        AttachmentStore.remove(post.attachment.id);
    }
}

function trimPosts() {
    if (DB.posts.length <= MAX_POSTS) return;
    const ownerId = currentUser ? currentUser.id : null;
    const sorted = DB.posts.slice().sort((a, b) => {
        const aOwn = a.authorId === ownerId ? 1 : 0;
        const bOwn = b.authorId === ownerId ? 1 : 0;
        if (aOwn !== bOwn) return bOwn - aOwn;
        return b.time - a.time;
    });
    const keep = sorted.slice(0, MAX_POSTS);
    const keepIds = new Set(keep.map(p => p.id));
    DB.posts.forEach(p => {
        if (keepIds.has(p.id)) return;
        if (p.attachment && p.attachment.id) {
            attachmentMemCache.delete(p.attachment.id);
            AttachmentStore.remove(p.attachment.id);
        }
    });
    DB.posts = keep;
}

/* ============================================================================
   17. REPUTATION + RANKING
   ============================================================================ */
function getUserRep(userId) {
    const value = DB.reputation[userId];
    return typeof value === 'number' ? value : 50;
}

function adjustReputation(userId, delta) {
    if (!userId) return;
    if (typeof DB.reputation[userId] !== 'number') DB.reputation[userId] = 50;
    DB.reputation[userId] = Math.max(0, Math.min(100, DB.reputation[userId] + delta));
}

function tokenize(text) {
    return (text || '').toLowerCase().match(/\b[a-z0-9]{3,}\b/g) || [];
}

function updateInterestProfile(text, weight) {
    if (!DB.interestProfile) DB.interestProfile = {};
    tokenize(text).forEach(word => {
        const current = DB.interestProfile[word] || 0;
        DB.interestProfile[word] = Math.max(-8, Math.min(15, current + weight));
    });
}

function scorePost(post) {
    const profile = DB.interestProfile || {};
    let score = 0;

    tokenize((post.text || '') + ' ' + (post.nick || '')).forEach(word => {
        if (profile[word]) score += profile[word] * 2.4;
    });

    const likes    = (post.likedBy || []).length;
    const dislikes = (post.dislikedBy || []).length;
    score += (likes - dislikes) * 2.8;
    score += (post.replies || []).length * 1.9;

    if (DB.following.some(f => f.peerId === post.authorId)) score += 7;

    const hours = (Date.now() - post.time) / 3600000;
    score -= hours * 0.55;
    if (hours < 0.5) score += 8;
    else if (hours < 2) score += 5;
    else if (hours < 8) score += 2;

    score *= (0.4 + (getUserRep(post.authorId) / 100) * 1.1);

    const viewers = Math.max(1, post.viewerCount || 1);
    const reports = (post.reports || []).length;
    score -= (reports / viewers) * 55;
    if (reports >= 2) score -= reports * 4.5;

    score += Math.sin(post.time / 80000) * 1.2;
    return score;
}

function pruneReportedPosts() {
    const ownerId = currentUser ? currentUser.id : null;
    const removed = [];

    DB.posts = DB.posts.filter(post => {
        if (post.authorId === ownerId) return true; // authors keep their own copy
        const reports = (post.reports || []).length;
        const viewers = Math.max(1, post.viewerCount || 0);
        if (reports >= REPORT_MIN_COUNT && reports / viewers >= REPORT_THRESHOLD) {
            removed.push(post.id);
            return false;
        }
        return true;
    });

    if (removed.length) {
        removed.forEach(id => {
            DB.likedPosts = DB.likedPosts.filter(x => x !== id);
            DB.dislikedPosts = DB.dislikedPosts.filter(x => x !== id);
            broadcastToFeed({ type: 'delete_post', postId: id });
        });
        schedulePersist(400);
    }
}

function getVisibleFeed() {
    pruneReportedPosts();
    const ownerId = currentUser ? currentUser.id : null;

    if (DB.posts.length < FEED_ALGO_THRESHOLD) {
        return DB.posts.slice().sort((a, b) => b.time - a.time);
    }

    const disliked = new Set(DB.dislikedPosts);
    return DB.posts
        .filter(p => !disliked.has(p.id) || p.authorId === ownerId)
        .map(p => ({ post: p, score: scorePost(p) }))
        .sort((a, b) => b.score - a.score)
        .map(x => x.post);
}

/* ============================================================================
   18. VIEW TRACKING (batched, self-views excluded, broadcast in bulk)
   ============================================================================ */
let pendingViewUpdates = [];
let viewFlushTimer = null;

function queueView(post) {
    if (!currentUser) return;
    if (post.authorId === currentUser.id) return;              // don't count self-views
    post.viewedBy = post.viewedBy || [];
    if (post.viewedBy.some(v => v.id === currentUser.id)) return;

    const entry = { id: currentUser.id, time: Date.now() };
    post.viewedBy.push(entry);
    post.viewerCount = (post.viewerCount || 0) + 1;
    if (post.viewedBy.length > MAX_VIEWED_BY) {
        post.viewedBy = post.viewedBy.slice(-MAX_VIEWED_BY);
    }

    pendingViewUpdates.push({ postId: post.id, viewerId: currentUser.id, time: entry.time });
    schedulePersist(1200);
    refreshAnalyticsIfActive();

    if (!viewFlushTimer) {
        viewFlushTimer = setTimeout(() => {
            viewFlushTimer = null;
            if (!pendingViewUpdates.length) return;
            const batch = pendingViewUpdates.slice(0, 60);
            pendingViewUpdates = pendingViewUpdates.slice(60);
            broadcastToFeed({ type: 'post_views', updates: batch });
            if (pendingViewUpdates.length && !viewFlushTimer) {
                viewFlushTimer = setTimeout(() => { viewFlushTimer = null; }, 100);
            }
        }, 4000);
    }
}

function applyViewUpdates(updates) {
    if (!Array.isArray(updates)) return;
    let changed = false;
    updates.forEach(u => {
        if (!u || !u.postId || !u.viewerId) return;
        const post = getPost(u.postId);
        if (!post) return;
        post.viewedBy = post.viewedBy || [];
        if (post.viewedBy.some(v => v.id === u.viewerId)) return;
        post.viewedBy.push({ id: u.viewerId, time: u.time || Date.now() });
        post.viewerCount = (post.viewerCount || 0) + 1;
        if (post.viewedBy.length > MAX_VIEWED_BY) {
            post.viewedBy = post.viewedBy.slice(-MAX_VIEWED_BY);
        }
        changed = true;
    });
    if (changed) {
        schedulePersist(1200);
        refreshAnalyticsIfActive();
    }
}

/* ============================================================================
   19. NETWORK — directory election, feed relay, follows, public rooms
   ============================================================================ */
let globalFeedUnused = null; // kept intentionally out of the data model
let directoryPeer = null;
let isDirectory = false;
let activeFeedConns = [];
let feedConn = null;
let reconnectTimer = null;
let activePublicRooms = [];

function updateFeedStatus() {
    const el = document.getElementById('feedStatus');
    if (el) {
        if (isDirectory) el.textContent = 'Hosting network';
        else if (feedConn && feedConn.open) el.textContent = 'Connected';
        else el.textContent = 'Connecting...';
    }
    const netEl = document.getElementById('netStatus2');
    if (netEl) {
        if (isDirectory) netEl.textContent = 'Hosting the network (directory node)';
        else if (feedConn && feedConn.open) netEl.textContent = 'Connected to the network';
        else netEl.textContent = 'Connecting...';
    }
}

function peerLibraryAvailable() {
    return typeof Peer !== 'undefined';
}

function initBackgroundPeer() {
    if (!peerLibraryAvailable()) {
        showToast('Network library unavailable — the feed and rooms are offline.', 'error', 6000);
        updateFeedStatus();
        return;
    }

    try {
        directoryPeer = new Peer(DIR_ID, { debug: 0 });
    } catch (err) {
        console.warn('[peer] init failed', err);
        becomeFeedClient();
        return;
    }

    directoryPeer.on('open', () => {
        isDirectory = true;
        activePublicRooms = activePublicRooms.filter(r => Date.now() - r.time < 3600000);
        updateFeedStatus();
        renderFeed();
    });

    directoryPeer.on('connection', handleDirectoryConnection);

    directoryPeer.on('error', err => {
        if (err && err.type === 'unavailable-id') {
            isDirectory = false;
            try { directoryPeer.destroy(); } catch (_) {}
            directoryPeer = null;
            becomeFeedClient();
        } else {
            console.warn('[peer] directory error', err);
            updateFeedStatus();
        }
    });

    directoryPeer.on('disconnected', () => {
        try { directoryPeer && directoryPeer.reconnect(); } catch (_) {}
    });
}

function handleDirectoryConnection(conn) {
    activeFeedConns.push(conn);
    let registeredRoom = null;

    conn.on('data', raw => {
        const msg = safeParse(typeof raw === 'string' ? raw : JSON.stringify(raw), null);
        if (!msg || !msg.type) return;

        switch (msg.type) {
            case 'register_room':
                registeredRoom = { room: msg.room, hostId: msg.hostId };
                if (!activePublicRooms.some(r => r.room === msg.room && r.hostId === msg.hostId)) {
                    activePublicRooms.push({
                        room: msg.room, host: msg.host, hostId: msg.hostId, time: Date.now()
                    });
                }
                break;

            case 'unregister_room':
                activePublicRooms = activePublicRooms.filter(
                    r => !(r.room === msg.room && r.hostId === msg.hostId)
                );
                break;

            case 'get_rooms':
                conn.send(JSON.stringify({
                    type: 'room_list',
                    rooms: activePublicRooms.filter(r => Date.now() - r.time < 3600000)
                }));
                break;

            case 'get_feed':
                conn.send(JSON.stringify({
                    type: 'feed_data',
                    posts: DB.posts.slice(0, 200).map(serializePost)
                }));
                break;

            case 'new_post':
                if (msg.post && msg.post.id && !getPost(msg.post.id)) {
                    const post = deserializePost(msg.post);
                    if (post) {
                        upsertPost(post);
                        schedulePersist(600);
                        renderFeed();
                        refreshAnalyticsIfActive();
                        if (post.authorId !== currentUser.id) {
                            notify('New post from ' + post.nick, (post.text || '').slice(0, 80));
                        }
                    }
                }
                relayToFeedPeers(conn, msg);
                break;

            case 'update_post': {
                const incoming = deserializePost(msg.post);
                if (incoming) {
                    upsertPost(incoming);
                    schedulePersist(600);
                    renderFeed();
                    refreshAnalyticsIfActive();
                }
                relayToFeedPeers(conn, msg);
                break;
            }

            case 'delete_post':
                removePostById(msg.postId);
                schedulePersist(400);
                renderFeed();
                renderMyPosts();
                refreshAnalyticsIfActive();
                relayToFeedPeers(conn, msg);
                break;

            case 'post_views':
                applyViewUpdates(msg.updates);
                relayToFeedPeers(conn, msg);
                break;

            case 'follow':
            case 'unfollow':
            case 'sync_follows':
                applyFollowPayload(msg);
                relayToFeedPeers(conn, msg);
                break;

            default:
                break;
        }
    });

    conn.on('close', () => {
        activeFeedConns = activeFeedConns.filter(c => c !== conn);
        if (registeredRoom) {
            activePublicRooms = activePublicRooms.filter(
                r => !(r.room === registeredRoom.room && r.hostId === registeredRoom.hostId)
            );
        }
    });

    conn.on('error', () => {
        activeFeedConns = activeFeedConns.filter(c => c !== conn);
    });
}

function relayToFeedPeers(originConn, msg) {
    const payload = JSON.stringify(msg);
    activeFeedConns.forEach(c => {
        if (c !== originConn && c.open) {
            try { c.send(payload); } catch (_) {}
        }
    });
}

function becomeFeedClient() {
    if (!peerLibraryAvailable()) return;
    isDirectory = false;

    try { directoryPeer = new Peer({ debug: 0 }); }
    catch (err) { console.warn('[peer] client init failed', err); return; }

    directoryPeer.on('open', () => {
        feedConn = directoryPeer.connect(DIR_ID, { reliable: true });

        feedConn.on('open', () => {
            updateFeedStatus();
            feedConn.send(JSON.stringify({ type: 'get_feed' }));
            feedConn.send(JSON.stringify({ type: 'get_rooms' }));
            broadcastFollows();
        });

        feedConn.on('data', raw => {
            const msg = safeParse(typeof raw === 'string' ? raw : JSON.stringify(raw), null);
            if (!msg || !msg.type) return;

            switch (msg.type) {
                case 'feed_data': {
                    const incoming = (msg.posts || []).map(deserializePost).filter(Boolean);
                    const known = new Set(DB.posts.map(p => p.id));
                    incoming.forEach(p => { if (!known.has(p.id)) { DB.posts.push(p); known.add(p.id); } });
                    DB.posts.sort((a, b) => b.time - a.time);
                    trimPosts();
                    schedulePersist(600);
                    renderFeed();
                    refreshAnalyticsIfActive();
                    break;
                }
                case 'new_post': {
                    const post = deserializePost(msg.post);
                    if (post && !getPost(post.id)) {
                        upsertPost(post);
                        schedulePersist(600);
                        renderFeed();
                        refreshAnalyticsIfActive();
                        if (post.authorId !== currentUser.id) {
                            notify('New post from ' + post.nick, (post.text || '').slice(0, 80));
                        }
                    }
                    break;
                }
                case 'update_post': {
                    const post = deserializePost(msg.post);
                    if (post) {
                        upsertPost(post);
                        schedulePersist(600);
                        renderFeed();
                        refreshAnalyticsIfActive();
                    }
                    break;
                }
                case 'delete_post':
                    removePostById(msg.postId);
                    schedulePersist(400);
                    renderFeed();
                    renderMyPosts();
                    refreshAnalyticsIfActive();
                    break;
                case 'post_views':
                    applyViewUpdates(msg.updates);
                    break;
                case 'follow':
                case 'unfollow':
                case 'sync_follows':
                    applyFollowPayload(msg);
                    break;
                case 'room_list':
                    renderPublicRooms(msg.rooms || []);
                    break;
                default:
                    break;
            }
        });

        feedConn.on('close', () => {
            feedConn = null;
            updateFeedStatus();
            scheduleReconnect();
        });

        feedConn.on('error', () => {
            feedConn = null;
            updateFeedStatus();
            scheduleReconnect();
        });
    });

    directoryPeer.on('error', err => {
        if (err && err.type === 'unavailable-id') {
            try { directoryPeer.destroy(); } catch (_) {}
            directoryPeer = null;
        }
        updateFeedStatus();
    });
}

function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (isDirectory) return;
        if (feedConn && feedConn.open) return;
        try { directoryPeer && directoryPeer.destroy(); } catch (_) {}
        directoryPeer = null;
        becomeFeedClient();
    }, 3500);
}

function broadcastToFeed(msg) {
    const payload = JSON.stringify(msg);
    if (isDirectory) {
        activeFeedConns.forEach(c => { if (c.open) { try { c.send(payload); } catch (_) {} } });
    } else if (feedConn && feedConn.open) {
        try { feedConn.send(payload); } catch (_) {}
    }
}

/* --------------------------- Follows ------------------------------------- */
function applyFollowPayload(msg) {
    if (!currentUser) return;
    let changed = false;

    const handleSingle = (targetId, follower, isUnfollow) => {
        if (!follower || !follower.peerId) return;
        if (targetId !== currentUser.id) return;
        if (follower.peerId === currentUser.id) return;

        if (isUnfollow) {
            const before = DB.followers.length;
            DB.followers = DB.followers.filter(f => f.peerId !== follower.peerId);
            if (DB.followers.length !== before) changed = true;
        } else if (!DB.followers.some(f => f.peerId === follower.peerId)) {
            DB.followers.push({
                peerId: follower.peerId,
                nick: follower.nick || 'User',
                time: Date.now()
            });
            changed = true;
        }
    };

    if (msg.type === 'sync_follows') {
        (msg.follows || []).forEach(item => {
            if (!item) return;
            handleSingle(item.targetId, item.follower, false);
        });
    } else if (msg.type === 'follow') {
        handleSingle(msg.targetId, msg.follower, false);
    } else if (msg.type === 'unfollow') {
        handleSingle(msg.targetId, msg.follower, true);
    }

    if (changed) {
        schedulePersist(500);
        refreshAnalyticsIfActive();
    }
}

function broadcastFollows() {
    if (!currentUser || !DB.following.length) return;
    broadcastToFeed({
        type: 'sync_follows',
        follows: DB.following.map(f => ({
            targetId: f.peerId,
            follower: { peerId: currentUser.id, nick: currentUser.nick }
        }))
    });
}

/* ============================================================================
   20. POST SERIALIZATION
   ============================================================================ */
function serializePost(post) {
    const out = Object.assign({}, post);
    if (post.attachment) {
        out.attachment = expandAttachment(post.attachment);
    }
    return out;
}

function deserializePost(raw) {
    if (!raw || !raw.id) return null;
    const post = migratePost(raw);
    if (post.attachment && post.attachment.dataUrl) {
        post.attachment = storeAttachment(post.attachment);
    }
    return post;
}

/* ============================================================================
   21. ATTACHMENT SELECTION UI
   ============================================================================ */
let pendingAttachment = null;

function handleFileSelect(event, context) {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) {
        showToast('File too large — the P2P limit is 2MB.', 'error');
        return;
    }

    const reader = new FileReader();
    reader.onload = e => {
        pendingAttachment = {
            name: file.name,
            type: file.type || 'application/octet-stream',
            size: file.size,
            dataUrl: e.target.result,
            context
        };
        if (context === 'post') {
            renderPostAttachmentPreview();
        } else {
            const input = document.getElementById('chatInput');
            if (input) input.placeholder = 'Attached: ' + file.name;
        }
    };
    reader.onerror = () => showToast('Could not read that file.', 'error');
    reader.readAsDataURL(file);
}

function renderPostAttachmentPreview() {
    const el = document.getElementById('postAttPreview');
    if (!el) return;
    if (!pendingAttachment || pendingAttachment.context !== 'post') {
        el.innerHTML = '';
        return;
    }
    let media;
    if (pendingAttachment.type.startsWith('image/')) {
        media = '<img src="' + pendingAttachment.dataUrl + '" alt="">';
    } else if (pendingAttachment.type.startsWith('video/')) {
        media = '<video src="' + pendingAttachment.dataUrl + '" controls></video>';
    } else {
        media = '<div class="file-att">' + escapeHtml(pendingAttachment.name) + '</div>';
    }
    el.innerHTML =
        '<div class="composer-attach-preview">' + media +
        '<button class="remove-att" onclick="clearAttachment(\'post\')" aria-label="Remove attachment">×</button></div>';
}

function clearAttachment(context) {
    if (!pendingAttachment || pendingAttachment.context !== context) return;
    pendingAttachment = null;
    if (context === 'post') {
        renderPostAttachmentPreview();
    } else {
        const input = document.getElementById('chatInput');
        if (input) input.placeholder = 'Type a message...';
    }
}

function renderAttachment(att) {
    if (!att) return '';
    const full = expandAttachment(att);
    const src = full && full.dataUrl;

    if (!src || !isSafeDataUrl(src)) {
        return '<div class="post-attachment"><div class="file-att">' +
               escapeHtml(att.name || 'Attachment') + ' (unavailable)</div></div>';
    }
    if (att.type && att.type.startsWith('image/')) {
        return '<div class="post-attachment"><img src="' + src +
               '" data-act="view-image" data-src="' + src + '" alt="" loading="lazy"></div>';
    }
    if (att.type && att.type.startsWith('video/')) {
        return '<div class="post-attachment"><video src="' + src + '" controls preload="metadata"></video></div>';
    }
    const kb = att.size ? Math.round(att.size / 1024) : '?';
    return '<div class="post-attachment"><a class="file-att" href="' + src +
           '" download="' + escapeHtml(att.name || 'file') + '">' +
           escapeHtml(att.name || 'file') + ' (' + kb + 'KB)</a></div>';
}

function renderChatAttachment(att) {
    if (!att) return '';
    const full = expandAttachment(att);
    const src = full && full.dataUrl;
    if (!src || !isSafeDataUrl(src)) return '';

    if (att.type && att.type.startsWith('image/')) {
        return '<div class="chat-msg-attachment"><img src="' + src +
               '" data-act="view-image" data-src="' + src + '" alt=""></div>';
    }
    if (att.type && att.type.startsWith('video/')) {
        return '<div class="chat-msg-attachment"><video src="' + src + '" controls></video></div>';
    }
    return '<div class="chat-msg-attachment"><a class="file-att" href="' + src +
           '" download="' + escapeHtml(att.name || 'file') +
           '" style="font-size:0.8rem;">' + escapeHtml(att.name || 'file') + '</a></div>';
}

/* ============================================================================
   22. POST CREATION
   ============================================================================ */
function postMessage() {
    const input = document.getElementById('postInput');
    if (!input || !currentUser) return;

    let text = input.value.trim();
    const attachment = (pendingAttachment && pendingAttachment.context === 'post') ? pendingAttachment : null;
    if (!text && !attachment) return;

    text = censorText(text);

    const post = {
        id: uid('p'),
        authorId: currentUser.id,
        nick: currentUser.nick,
        text,
        attachment: attachment ? storeAttachment(attachment) : null,
        time: Date.now(),
        likedBy: [],
        dislikedBy: [],
        viewedBy: [],
        viewerCount: 0,
        replies: [],
        reports: []
    };

    input.value = '';
    if (attachment) clearAttachment('post');

    upsertPost(post);
    updateInterestProfile(text, 2.5);
    if (typeof DB.reputation[currentUser.id] !== 'number') DB.reputation[currentUser.id] = 50;

    persist();
    trackEvent('posts');

    renderFeed();
    renderMyPosts();
    refreshAnalyticsIfActive();

    broadcastToFeed({ type: 'new_post', post: serializePost(post) });
    showToast('Posted!', 'success');
}

/* Track which reply boxes are open so re-renders don't collapse them. */

function toggleReplyInput(postId) {

    else replyOpen.add(postId);
    const box = document.getElementById('replies_' + postId);

/* ============================================================================
   24. POST INTERACTIONS
   ============================================================================ */
function handleInteraction(postId, type) {
    const post = getPost(postId);
    if (!post || !currentUser) return;

    const userId = currentUser.id;
    post.likedBy = post.likedBy || [];
    post.dislikedBy = post.dislikedBy || [];

    if (type === 'like') {
        const existing = post.likedBy.findIndex(x => x.id === userId);
        if (existing >= 0) {
            post.likedBy.splice(existing, 1);
            DB.likedPosts = DB.likedPosts.filter(id => id !== postId);
            updateInterestProfile(post.text, -1.2);
        } else {
            post.likedBy.push({ id: userId, time: Date.now() });
            if (!DB.likedPosts.includes(postId)) DB.likedPosts.push(postId);

            const dIdx = post.dislikedBy.findIndex(x => x.id === userId);
            if (dIdx >= 0) {
                post.dislikedBy.splice(dIdx, 1);
                DB.dislikedPosts = DB.dislikedPosts.filter(id => id !== postId);
            }
            updateInterestProfile(post.text, 3);
            adjustReputation(post.authorId, 0.5);
            trackEvent('likes');
        }
    } else {
        const existing = post.dislikedBy.findIndex(x => x.id === userId);
        if (existing >= 0) {
            post.dislikedBy.splice(existing, 1);
            DB.dislikedPosts = DB.dislikedPosts.filter(id => id !== postId);
            updateInterestProfile(post.text, 1);
        } else {
            post.dislikedBy.push({ id: userId, time: Date.now() });
            if (!DB.dislikedPosts.includes(postId)) DB.dislikedPosts.push(postId);

            const lIdx = post.likedBy.findIndex(x => x.id === userId);
            if (lIdx >= 0) {
                post.likedBy.splice(lIdx, 1);
                DB.likedPosts = DB.likedPosts.filter(id => id !== postId);
            }
            updateInterestProfile(post.text, -3);
            adjustReputation(post.authorId, -1);
        }
    }

    persist();
    broadcastToFeed({ type: 'update_post', post: serializePost(post) });
    renderFeed();
    renderMyPosts();
    refreshAnalyticsIfActive();
}

function reportPost(postId) {
    if (!DB.reportsMade[postId] === false && DB.reportsMade[postId]) {
        showToast('You already reported this post.', 'warning');
        return;
    }
    const overlay = showModal('Report Post', `
        <p style="margin-bottom:12px;font-size:0.9rem;color:var(--text-muted)">Select a reason. Posts reported by 25% or more of their viewers are automatically hidden.</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-secondary" data-reason="spam">Spam</button>
            <button class="btn btn-secondary" data-reason="harassment">Harassment</button>
            <button class="btn btn-secondary" data-reason="inappropriate">Inappropriate content</button>
            <button class="btn btn-secondary" data-reason="other">Other</button>
        </div>
    `, [{ label: 'Cancel', class: 'btn-secondary' }]);

    overlay.querySelectorAll('[data-reason]').forEach(btn => {
        btn.onclick = () => {
            const reason = btn.dataset.reason;
            const post = getPost(postId);
            if (!post) { overlay.remove(); return; }
            post.reports = post.reports || [];
            post.reports.push({ userId: currentUser.id, reason, time: Date.now() });
            DB.reportsMade[postId] = { reason, time: Date.now() };
            adjustReputation(post.authorId, -3.5);
            trackEvent('reports');
            persist();
            broadcastToFeed({ type: 'update_post', post: serializePost(post) });
            renderFeed();
            renderMyPosts();
            refreshAnalyticsIfActive();
            showToast('Report submitted. Thank you.', 'success');
            overlay.remove();
        };
    });
}

function sendReply(postId) {
    const input = document.getElementById('replyText_' + postId);
    if (!input || !currentUser) return;

    let text = input.value.trim();
    if (!text) return;
    text = censorText(text);

    const post = getPost(postId);
    if (!post) return;

    post.replies = post.replies || [];
    post.replies.push({ authorId: currentUser.id, nick: currentUser.nick, text, time: Date.now() });

    updateInterestProfile(post.text, 3.5);
    adjustReputation(post.authorId, 0.7);

    input.value = '';
    replyOpen.delete(postId);
    const box = document.getElementById('replies_' + postId);
    if (box) box.classList.add('hidden');

    persist();
    broadcastToFeed({ type: 'update_post', post: serializePost(post) });
    renderFeed();
    renderMyPosts();
    refreshAnalyticsIfActive();

    if (post.authorId !== currentUser.id) {
        notify('New reply on your post', text.slice(0, 60));
    }
}

function deletePost(postId) {
    showModal('Delete Post', '<p>Are you sure you want to delete this post?</p>', [
        { label: 'Cancel', class: 'btn-secondary' },
        { label: 'Delete', class: 'btn-danger', onClick: () => {
            removePostById(postId);
            replyOpen.delete(postId);
            persist();
            broadcastToFeed({ type: 'delete_post', postId });
            renderFeed();
            renderMyPosts();
            refreshAnalyticsIfActive();
            showToast('Post deleted', 'success');
        }}
    ]);
}

function renderProfile() {
    const el = document.getElementById('profileContent');
    const headerActions = document.getElementById('profileHeaderActions');
    if (!el || !currentUser) return;

    let user, userId, isMe;
    if (viewingUserId && viewingUserId !== currentUser.id) {
        userId = viewingUserId;
        user = DB.users[userId];
        if (!user) {
            const authored = DB.posts.find(p => p.authorId === userId);
            user = {
                id: userId,
                nick: (authored && authored.nick) || 'Unknown User',
                email: null,
                bio: '',
                createdAt: null
            };
        }
        isMe = false;
    } else {
        user = currentUser;
        userId = currentUser.id;
        viewingUserId = null;
        document.getElementById('profileHeaderTitle').textContent = 'My Profile';
        isMe = true;
    }

        .filter(p => p.authorId === userId)
        .sort((a, b) => b.time - a.time);

    const followingCount = isMe
        ? DB.following.length
        : DB.following.filter(f => f.peerId === userId).length;
    const followersCount = DB.followers.filter(f => f.peerId === userId).length;
    const isFollowing = DB.following.some(f => f.peerId === userId);
    const initial = (user.nick || '?').charAt(0).toUpperCase();
    const rep = Math.round(getUserRep(userId));

    headerActions.innerHTML = isMe
        ? '<button class="btn btn-secondary btn-small" onclick="editProfile()">Edit</button>'
        : '<button class="btn ' + (isFollowing ? 'btn-secondary' : 'btn-primary') +
          ' btn-small" data-act="toggle-follow" data-uid="' + escapeHtml(userId) +
          '" data-nick="' + escapeHtml(user.nick) + '">' +
          (isFollowing ? 'Following' : 'Follow') + '</button>';

    const postsHtml = userPosts.length
        ? userPosts.map(p => renderPostCard(p, p.authorId === currentUser.id)).join('')
        : '<div class="empty-state"><div class="empty-state-text">No posts yet</div></div>';

    el.innerHTML = `
        <div class="profile-header-card">
            <div class="profile-banner"></div>
            <div class="profile-info">
                <div class="user-avatar">${escapeHtml(initial)}</div>
                <div class="profile-details">
                    <div class="profile-name">${escapeHtml(user.nick)}</div>
                    <div class="profile-email">${user.email ? escapeHtml(user.email) : (user.isGuest ? 'Guest account' : '')}</div>
                    <div class="profile-stats">
                        <div class="stat"><div class="stat-num">${userPosts.length}</div><div class="stat-label">Posts</div></div>
                        <div class="stat"><div class="stat-num">${isMe ? followingCount : '—'}</div><div class="stat-label">Following</div></div>
                        <div class="stat"><div class="stat-num">${followersCount}</div><div class="stat-label">Followers</div></div>
                        <div class="stat"><div class="stat-num">${rep}</div><div class="stat-label">Reputation</div></div>

            const oldNick = currentUser.nick;
            currentUser.nick = newNick;

                const bioEl = document.getElementById('editBio');
                if (bioEl) DB.users[currentUser.id].bio = bioEl.value.trim();

            // Keep every cached post author name in sync.

            DB.following.forEach(f => { if (f.peerId === currentUser.id) f.nick = newNick; });

function toggleFollow(userId, nick) {
    const idx = DB.following.findIndex(f => f.peerId === userId);
    if (idx >= 0) {
        DB.following.splice(idx, 1);
        persist();
        broadcastToFeed({ type: 'unfollow', targetId: userId, follower: { peerId: currentUser.id } });
        showToast('Unfollowed ' + nick, 'info');
    } else {
        DB.following.push({ peerId: userId, nick, time: Date.now() });
        persist();
        broadcastToFeed({
            type: 'follow',
            targetId: userId,
            follower: { peerId: currentUser.id, nick: currentUser.nick }
        });
        showToast('Now following ' + nick, 'success');
    }
    renderProfile();
    renderFeed();
    refreshAnalyticsIfActive();
}

   26. USER ANALYTICS  (real-time, computed from live post data)
   ============================================================================ */
let analyticsTimer = null;

function startAnalyticsLive() {
    renderAnalytics();
    stopAnalyticsLive();
    analyticsTimer = setInterval(renderAnalytics, ANALYTICS_REFRESH);
}

function stopAnalyticsLive() {
    if (analyticsTimer) {
        clearInterval(analyticsTimer);
        analyticsTimer = null;
    }
}

function refreshAnalyticsIfActive() {
    const view = document.getElementById('view-analytics');
    if (view && view.classList.contains('active')) renderAnalytics();
}

function computeUserAnalytics(userId) {
    const posts = DB.posts.filter(p => p.authorId === userId);
    const days = lastNDays(ANALYTICS_WINDOW);
    const daily = {};
    days.forEach(d => { daily[d] = { posts: 0, likes: 0, dislikes: 0, views: 0, reports: 0 }; });

    const bump = (key, field, amount) => {
        if (daily[key] && daily[key][field] !== undefined) daily[key][field] += amount;
    };

    let likes = 0, dislikes = 0, views = 0, reports = 0, replies = 0;

    posts.forEach(post => {
        const likedBy    = post.likedBy || [];
        const dislikedBy = post.dislikedBy || [];
        const viewedBy   = post.viewedBy || [];
        const postReplies= post.replies || [];
        const postReports= post.reports || [];

        likes    += likedBy.length;
        dislikes += dislikedBy.length;
        views    += Math.max(post.viewerCount || 0, viewedBy.length);
        reports  += postReports.length;
        replies  += postReplies.length;

        bump(dayKey(post.time), 'posts', 1);
        likedBy.forEach(x => bump(dayKey(x.time || post.time), 'likes', 1));
        dislikedBy.forEach(x => bump(dayKey(x.time || post.time), 'dislikes', 1));
        viewedBy.forEach(x => bump(dayKey(x.time || post.time), 'views', 1));
        postReports.forEach(x => bump(dayKey(x.time || post.time), 'reports', 1));
    });

    const interactions = likes + dislikes;
    const likeRatio = interactions > 0 ? (likes / interactions) * 100 : 0;
    const followers = DB.followers.filter(f => f.peerId === userId).length;
    const following = DB.following.filter(f => f.peerId === userId).length;
    const reportRate = views > 0 ? (reports / views) * 100 : 0;
    const engagementRate = views > 0 ? ((likes + dislikes + replies) / views) * 100 : 0;
    const avgViews = posts.length ? views / posts.length : 0;
    const reputation = Math.round(getUserRep(userId));

    const topPosts = posts
        .slice()
        .sort((a, b) => (b.likedBy || []).length - (a.likedBy || []).length)
        .slice(0, 5);

    return {
        posts, days, daily, likes, dislikes, views, reports, replies,
        likeRatio, followers, following, reportRate, engagementRate,
        avgViews, reputation, topPosts
    };
}

/* --------------------------- Canvas chart helpers ------------------------ */
function setupCanvas(canvas) {
    const parent = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(80, (parent ? parent.clientWidth : 300) - 20);
    const height = 120;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    return { ctx, width, height };
}

function drawBarChart(canvasId, values, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !values.length) return;

    const { ctx, width, height } = setupCanvas(canvas);
    const max = Math.max.apply(null, values.concat([1]));
    const pad = 8;
    const slot = (width - pad * 2) / values.length;
    const barWidth = Math.max(3, slot - 4);

    values.forEach((value, i) => {
        const barHeight = (value / max) * (height - pad * 2);
        const x = pad + i * slot;
        ctx.fillStyle = color;
        ctx.globalAlpha = value > 0 ? 1 : 0.18;
        ctx.fillRect(x, height - pad - barHeight, barWidth, Math.max(barHeight, value > 0 ? 2 : 1));
    });
    ctx.globalAlpha = 1;
}

function drawDualLineChart(canvasId, likes, dislikes) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !likes.length) return;

    const { ctx, width, height } = setupCanvas(canvas);
    const max = Math.max.apply(null, likes.concat(dislikes).concat([1]));
    const pad = 8;
    const step = (width - pad * 2) / Math.max(1, likes.length - 1);

    const strokeSeries = (series, color) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        series.forEach((value, i) => {
            const x = pad + i * step;
            const y = height - pad - (value / max) * (height - pad * 2);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Dots make single-day series readable.
        ctx.fillStyle = color;
        series.forEach((value, i) => {
            const x = pad + i * step;
            const y = height - pad - (value / max) * (height - pad * 2);
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
    };

    strokeSeries(likes, '#52d869');
    strokeSeries(dislikes, '#ff4d4d');
}

/* ============================================================================
   27. ROOMS
   ============================================================================ */
let hostPeer = null;
let guestPeer = null;
let guestConn = null;
let hostConnections = [];
let myRole = null;
let roomName = null;
let roomIsPrivate = false;
let roomCode = '';

function slugifyRoom(name) {
    const slug = String(name || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 24);
    if (slug) return slug;
    // Deterministic fallback for names with no alphanumerics.
    return PureSHA256.hex(String(name || 'room')).slice(0, 12);
}

function roomPeerId(name, isPrivate, code) {
    const suffix = isPrivate ? String(code || '').toUpperCase() : 'pub';
    return 'yipyap-room-' + slugifyRoom(name) + '-' + suffix.toLowerCase();
}

function generateCode() {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let out = '';
    for (let i = 0; i < 4; i++) out += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
    return out;
}

function toggleHostCode() {
    const checked = document.getElementById('hostPrivateCheck').checked;
    document.getElementById('hostCodeDisplay').classList.toggle('hidden', !checked);
    if (checked) document.getElementById('generatedCode').value = generateCode();
}

function toggleJoinCode() {
    const checked = document.getElementById('joinPrivateCheck').checked;
    document.getElementById('joinCodeArea').classList.toggle('hidden', !checked);
}

function resetRoomState() {
    if (hostPeer)  { try { hostPeer.destroy(); } catch (_) {} hostPeer = null; }
    if (guestPeer) { try { guestPeer.destroy(); } catch (_) {} guestPeer = null; }
    guestConn = null;
    hostConnections = [];
    myRole = null;
    roomName = null;
    roomIsPrivate = false;
    roomCode = '';
    clearTypingState();
    clearAttachment('chat');
    const nav = document.getElementById('chatNavItem');
    if (nav) nav.hidden = true;
}

function startHost() {
    if (!peerLibraryAvailable()) { showToast('Network library unavailable.', 'error'); return; }
    if (!currentUser) return;

    const nameInput = document.getElementById('hostRoomInput');
    const name = nameInput.value.trim();
    if (!name) { showToast('Enter a room name.', 'error'); return; }

    roomIsPrivate = document.getElementById('hostPrivateCheck').checked;
    roomCode = (document.getElementById('generatedCode').value || '').toUpperCase();
    if (roomIsPrivate && !roomCode) {
        roomCode = generateCode();
        document.getElementById('generatedCode').value = roomCode;
    }

    resetRoomState();
    roomName = name;
    myRole = 'host';

    const peerId = roomPeerId(roomName, roomIsPrivate, roomCode);

    try { hostPeer = new Peer(peerId, { debug: 0 }); }
    catch (err) {
        showToast('Could not start hosting.', 'error');
        resetRoomState();
        return;
    }

    hostPeer.on('open', () => {
        switchView('chat');
        document.getElementById('chatNavItem').hidden = false;
        document.getElementById('roomLabel').textContent = 'Room: ' + roomName;
        document.getElementById('messages').innerHTML = '';
        appendChatMsg('System',
            'Room created. ' + (roomIsPrivate ? 'Code: ' + roomCode : 'Public room.'),
            'system');
        if (!roomIsPrivate) registerPublicRoom(roomName);
    });

    hostPeer.on('connection', conn => {
        const nick = (conn.metadata && conn.metadata.nick) || 'Unknown';
        const peerKey = conn.peer || nick;
        const entry = { conn, nick, peerKey };
        hostConnections.push(entry);

        conn.on('open', () => {
            appendChatMsg('System', nick + ' joined.', 'system');
            hostConnections.forEach(other => {
                if (other.conn !== conn && other.conn.open) {
                    try { other.conn.send(JSON.stringify({ type: 'system', text: nick + ' joined.' })); } catch (_) {}
                }
            });
        });

        conn.on('data', raw => {
            const msg = safeParse(typeof raw === 'string' ? raw : JSON.stringify(raw), null);
            if (!msg || !msg.type) return;

            if (msg.type === 'chat') {
                appendChatMsg(nick, msg.text, 'other', msg.attachment, msg.time);
                hostConnections.forEach(other => {
                    if (other.conn !== conn && other.conn.open) {
                        try {
                            other.conn.send(JSON.stringify({
                                type: 'chat', nick, text: msg.text,
                                attachment: msg.attachment, time: msg.time
                            }));
                        } catch (_) {}
                    }
                });
                if (document.hidden) notify(nick, (msg.text || '').slice(0, 60));
            } else if (msg.type === 'typing') {
                showTypingIndicator(peerKey, nick);
                hostConnections.forEach(other => {
                    if (other.conn !== conn && other.conn.open) {
                        try { other.conn.send(JSON.stringify({ type: 'typing', peerKey, nick })); } catch (_) {}
                    }
                });
            }
        });

        conn.on('close', () => {
            hostConnections = hostConnections.filter(e => e.conn !== conn);
            clearTypingFor(peerKey);
            appendChatMsg('System', nick + ' left.', 'system');
            hostConnections.forEach(other => {
                if (other.conn.open) {
                    try { other.conn.send(JSON.stringify({ type: 'system', text: nick + ' left.' })); } catch (_) {}
                }
            });
        });

        conn.on('error', () => {
            hostConnections = hostConnections.filter(e => e.conn !== conn);
            clearTypingFor(peerKey);
        });
    });

    hostPeer.on('error', err => {
        if (err && err.type === 'unavailable-id') {
            showToast('That room name is already in use. Try another.', 'error');
        } else {
            showToast('Hosting error. The room was closed.', 'error');
        }
        resetRoomState();
        switchView('rooms');
    });
}

function startJoin() {
    if (!peerLibraryAvailable()) { showToast('Network library unavailable.', 'error'); return; }
    if (!currentUser) return;

    const name = document.getElementById('joinRoomInput').value.trim();
    if (!name) { showToast('Enter a room name.', 'error'); return; }

    roomIsPrivate = document.getElementById('joinPrivateCheck').checked;
    roomCode = (document.getElementById('joinCodeInput').value || '').toUpperCase();

    if (roomIsPrivate && !roomCode) {
        showToast('Enter the room code.', 'error');
        return;
    }

    resetRoomState();
    roomName = name;
    myRole = 'guest';

    const targetId = roomPeerId(roomName, roomIsPrivate, roomCode);

    try { guestPeer = new Peer({ debug: 0 }); }
    catch (err) {
        showToast('Could not connect.', 'error');
        resetRoomState();
        return;
    }

    guestPeer.on('open', () => {
        guestConn = guestPeer.connect(targetId, {
            metadata: { nick: currentUser.nick },
            reliable: true
        });

        guestConn.on('open', () => {
            switchView('chat');
            document.getElementById('chatNavItem').hidden = false;
            document.getElementById('roomLabel').textContent = 'Room: ' + roomName;
            document.getElementById('messages').innerHTML = '';
            appendChatMsg('System', 'Connected to the room.', 'system');
        });

        guestConn.on('data', raw => {
            const msg = safeParse(typeof raw === 'string' ? raw : JSON.stringify(raw), null);
            if (!msg || !msg.type) return;

            if (msg.type === 'chat') {
                appendChatMsg(msg.nick, msg.text, 'other', msg.attachment, msg.time);
                if (document.hidden) notify(msg.nick, (msg.text || '').slice(0, 60));
            } else if (msg.type === 'system') {
                appendChatMsg('System', msg.text, 'system');
            } else if (msg.type === 'typing') {
                showTypingIndicator(msg.peerKey || msg.nick, msg.nick);
            }
        });

        guestConn.on('close', () => {
            appendChatMsg('System', 'Disconnected from the room.', 'system');
        });

        guestConn.on('error', () => {
            showToast('Connection lost.', 'error');
            resetRoomState();
            switchView('rooms');
        });
    });

    guestPeer.on('error', err => {
        if (err && err.type === 'peer-unavailable') {
            showToast('Room not found. Check the name and code.', 'error');
        } else {
            showToast('Could not join that room.', 'error');
        }
        resetRoomState();
        switchView('rooms');
    });
}

function registerPublicRoom(room) {
    if (isDirectory) {
        if (!activePublicRooms.some(r => r.room === room && r.hostId === currentUser.id)) {
            activePublicRooms.push({
                room, host: currentUser.nick, hostId: currentUser.id, time: Date.now()
            });
        }
        return;
    }
    if (feedConn && feedConn.open) {
        feedConn.send(JSON.stringify({
            type: 'register_room', room, host: currentUser.nick, hostId: currentUser.id
        }));
    } else {
        showToast('Not connected to the directory — room will not be listed publicly.', 'warning');
    }
}

function unregisterPublicRoom(room) {
    if (isDirectory) {
        activePublicRooms = activePublicRooms.filter(
            r => !(r.room === room && r.hostId === currentUser.id)
        );
        return;
    }
    if (feedConn && feedConn.open) {
        feedConn.send(JSON.stringify({ type: 'unregister_room', room, hostId: currentUser.id }));
    }
}

function fetchPublicRooms() {
    const el = document.getElementById('publicRoomsList');
    if (!el) return;
    el.innerHTML = '<div class="text-muted">Searching...</div>';

    if (isDirectory) {
        renderPublicRooms(activePublicRooms.filter(r => Date.now() - r.time < 3600000));
        return;
    }
    if (feedConn && feedConn.open) {
        feedConn.send(JSON.stringify({ type: 'get_rooms' }));
        setTimeout(() => {
            if (el.innerHTML.indexOf('Searching') !== -1) {
                el.innerHTML = '<div class="text-muted">No rooms found.</div>';
            }
        }, 3000);
    } else {
        el.innerHTML = '<div class="text-muted">Not connected to the directory.</div>';
    }
}

function renderPublicRooms(rooms) {
    const el = document.getElementById('publicRoomsList');
    if (!el) return;
    if (!rooms || !rooms.length) {
        el.innerHTML = '<div class="text-muted">No public rooms active.</div>';
        return;
    }
    el.innerHTML = rooms
        .slice()
        .sort((a, b) => b.time - a.time)
        .map(r => `
            <div class="room-list-item">
                <div class="room-info">
                    <div class="room-name">${escapeHtml(r.room)}</div>
                    <div class="room-meta">Host: ${escapeHtml(r.host)}</div>
                </div>
                <button class="btn btn-primary btn-small" data-act="quick-join" data-room="${escapeHtml(r.room)}">Join</button>
            </div>`).join('');
}

function quickJoinRoom(room) {
    document.getElementById('joinRoomInput').value = room;
    document.getElementById('joinPrivateCheck').checked = false;
    document.getElementById('joinCodeInput').value = '';
    toggleJoinCode();
    startJoin();
}

/* --------------------------- Chat + typing ------------------------------- */
const TYPING_SEND_THROTTLE = 1200;
const TYPING_CLEAR_MS = 2500;
let lastTypingSentAt = 0;
const typingUsers = {};

function clearTypingState() {
    Object.keys(typingUsers).forEach(k => clearTimeout(typingUsers[k]));
    Object.keys(typingUsers).forEach(k => delete typingUsers[k]);
    renderTypingIndicator();
    lastTypingSentAt = 0;
}

function clearTypingFor(key) {
    if (typingUsers[key]) {
        clearTimeout(typingUsers[key]);
        delete typingUsers[key];
        renderTypingIndicator();
    }
}

function showTypingIndicator(key, nick) {
    if (!key) return;
    if (typingUsers[key]) clearTimeout(typingUsers[key]);
    typingUsers[key] = setTimeout(() => {
        delete typingUsers[key];
        renderTypingIndicator();
    }, TYPING_CLEAR_MS);
    typingUsers[key].nick = nick;
    renderTypingIndicator();
}

function renderTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (!el) return;
    const keys = Object.keys(typingUsers);
    if (!keys.length) {
        el.classList.remove('visible');
        el.textContent = '';
        return;
    }
    const names = keys.map(k => typingUsers[k].nick || 'Someone');
    let label;
    if (names.length === 1) label = names[0] + ' is typing';
    else if (names.length === 2) label = names[0] + ' and ' + names[1] + ' are typing';
    else label = names.length + ' people are typing';
    el.textContent = label + '…';
    el.classList.add('visible');
}

function onChatInputTyping() {
    if (!myRole || !currentUser) return;
    const now = Date.now();
    if (now - lastTypingSentAt < TYPING_SEND_THROTTLE) return;
    lastTypingSentAt = now;

    const payload = JSON.stringify({
        type: 'typing',
        peerKey: myPeerId,
        nick: currentUser.nick
    });

    if (myRole === 'host') {
        hostConnections.forEach(e => {
            if (e.conn.open) { try { e.conn.send(payload); } catch (_) {} }
        });
    } else if (guestConn && guestConn.open) {
        try { guestConn.send(payload); } catch (_) {}
    }
}

function sendChat() {
    if (!myRole || !currentUser) return;
    const input = document.getElementById('chatInput');
    if (!input) return;

    let text = input.value.trim();
    const attachment = (pendingAttachment && pendingAttachment.context === 'chat') ? pendingAttachment : null;
    if (!text && !attachment) return;

    text = censorText(text);
    input.value = '';
    if (attachment) clearAttachment('chat');

    const time = Date.now();
    appendChatMsg(currentUser.nick + ' (You)', text, 'self', attachment, time);
    trackEvent('messages');

    if (myRole === 'host') {
        hostConnections.forEach(e => {
            if (e.conn.open) {
                try {
                    e.conn.send(JSON.stringify({
                        type: 'chat', nick: currentUser.nick,
                        text, attachment, time
                    }));
                } catch (_) {}
            }
        });
    } else if (guestConn && guestConn.open) {
        try {
            guestConn.send(JSON.stringify({
                type: 'chat', nick: currentUser.nick,
                text, attachment, time
            }));
        } catch (_) {}
    }
}

function appendChatMsg(author, text, role, attachment, time) {
    const container = document.getElementById('messages');
    if (!container) return;

    const stamp = new Date(time || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (role === 'system') {
        container.insertAdjacentHTML('beforeend',
            '<div class="chat-msg-system">' + escapeHtml(text) + '</div>');
        container.scrollTop = container.scrollHeight;
        return;
    }

    const align = (DB.settings && DB.settings.chatAlign) || 'me-right';
    const isSelf = role === 'self';

    let isRight = false;
    if (align === 'me-right') isRight = isSelf;
    else if (align === 'me-left') isRight = !isSelf;
    else if (align === 'all-right') isRight = true;

    let cls = 'chat-msg';
    if (isRight) cls += ' right';
    if (isSelf) cls += ' self';

    const initial = (author || '?').charAt(0).toUpperCase();

    container.insertAdjacentHTML('beforeend', `
        <div class="${cls}">
            <div class="user-avatar" style="width:32px;height:32px;font-size:0.8rem;">${escapeHtml(initial)}</div>
            <div>
                ${isSelf ? '' : '<div class="chat-msg-author">' + escapeHtml(author) + '</div>'}
                <div class="chat-msg-bubble">${escapeHtml(text)}${renderChatAttachment(attachment)}</div>
                <div class="chat-msg-meta">${stamp}</div>
            </div>
        </div>`);
    container.scrollTop = container.scrollHeight;
}

function leaveRoom() {
    showModal('Leave Room', '<p>Are you sure you want to leave this room?</p>', [

}

function setTheme(theme) {
    DB.settings.theme = theme;
    persist();
    applyTheme();
    renderSettings();
}

function applyTheme() {
    const theme = (DB && DB.settings && DB.settings.theme) || 'dark';
    document.body.setAttribute('data-theme', theme);
}

function updateSetting(key, value) {
    DB.settings[key] = value;
    persist();

    if (key === 'notifications' && value && 'Notification' in window) {
        if (Notification.permission === 'default') {
            Notification.requestPermission().catch(() => {});
        }
    }
    if (key === 'sound' && value) playSound();
    renderSettings();
}

function clearAnalytics() {
    Storage.remove(ANALYTICS_KEY);
    showToast('Local analytics cleared.', 'success');
}

function clearFeedCache() {
    showModal('Clear Feed Cache', '<p>This removes all downloaded feed posts from this device. Your own posts are kept.</p>', [
        { label: 'Cancel', class: 'btn-secondary' },
        { label: 'Clear', class: 'btn-danger', onClick: () => {
            const mine = DB.posts.filter(p => p.authorId === currentUser.id);
            DB.posts.forEach(p => {
                if (p.authorId === currentUser.id) return;
                if (p.attachment && p.attachment.id) {
                    attachmentMemCache.delete(p.attachment.id);
                    AttachmentStore.remove(p.attachment.id);
                }
            });
            DB.posts = mine;
            persist();
            renderFeed();
            renderMyPosts();
            refreshAnalyticsIfActive();
            showToast('Feed cache cleared.', 'success');
        }}
    ]);
}

function resetAlgorithm() {
    DB.interestProfile = {};
    DB.likedPosts = [];
    DB.dislikedPosts = [];
    DB.viewedPosts = [];
    persist();
    renderFeed();
    refreshAnalyticsIfActive();
    showToast('Algorithm reset.', 'success');
}

function wipeAll() {
    showModal('Wipe All Data',
        '<p>This permanently deletes your account, posts, settings and analytics from this device. This cannot be undone.</p>', [
        { label: 'Cancel', class: 'btn-secondary' },
        { label: 'Wipe Everything', class: 'btn-danger', onClick: async () => {
            Storage.remove(DB_KEY);
            Storage.remove(SESSION_KEY);
            Storage.remove(ANALYTICS_KEY);
            try { await AttachmentStore.clear(); } catch (_) {}
            location.reload();
        }}
    ]);
}

/* ============================================================================
   29. GLOBAL EVENT DELEGATION
   ---------------------------------------------------------------------------
   Dynamic markup never embeds user data inside inline handlers; it uses
   data-* attributes resolved here. This removes a whole class of escaping and
   injection bugs.
   ============================================================================ */
document.addEventListener('click', event => {
    const target = event.target.closest('[data-act]');
    if (!target) return;

    const act = target.dataset.act;
    switch (act) {
        case 'profile':
            viewUserProfile(target.dataset.uid, target.dataset.nick);
            break;
        case 'like':
            handleInteraction(target.dataset.pid, 'like');
            break;
        case 'dislike':
            handleInteraction(target.dataset.pid, 'dislike');
            break;
        case 'reply-toggle':
            toggleReplyInput(target.dataset.pid);
            break;
        case 'reply-send':
            sendReply(target.dataset.pid);
            break;
        case 'delete-post':
            deletePost(target.dataset.pid);
            break;
        case 'report-post':
            reportPost(target.dataset.pid);
            break;
        case 'view-image':
            viewImage(target.dataset.src || target.getAttribute('src'));
            break;
        case 'copy':
            copyText(target.dataset.copy || '');
            break;
        case 'theme':
            setTheme(target.dataset.theme);
            break;
        case 'toggle-follow':
            toggleFollow(target.dataset.uid, target.dataset.nick);
            break;
        case 'quick-join':
            quickJoinRoom(target.dataset.room);
            break;
        default:
            break;
    }
});

document.addEventListener('keydown', event => {
    const el = event.target;
    if (el && el.dataset && el.dataset.replyInput && event.key === 'Enter') {
        event.preventDefault();
        sendReply(el.dataset.replyInput);
    }
});

/* ============================================================================
   30. LIFECYCLE
   ============================================================================ */
function flushPendingWork() {
    if (viewFlushTimer) {
        clearTimeout(viewFlushTimer);
        viewFlushTimer = null;
    }
    if (pendingViewUpdates.length) {
        broadcastToFeed({ type: 'post_views', updates: pendingViewUpdates.slice(0, 60) });
        pendingViewUpdates = [];
    }
    if (persistTimer) {
        clearTimeout(persistTimer);
        persistTimer = null;
    }
    persist();
}

window.addEventListener('pagehide', flushPendingWork);
window.addEventListener('beforeunload', flushPendingWork);

/* Keep multiple tabs consistent: a session change elsewhere wins. */
window.addEventListener('storage', event => {
    if (event.key === SESSION_KEY || event.key === null) {
        location.reload();
    }
});

window.addEventListener('resize', () => {
    if (window.innerWidth > 768) toggleSidebar(false);
    if (document.getElementById('view-analytics').classList.contains('active')) {
        renderAnalytics();
    }
});

/* Ask the browser to keep our data around (best-effort). */
async function requestPersistentStorage() {
    try {
        if (navigator.storage && navigator.storage.persist) {
            const already = await navigator.storage.persisted();
            if (!already) await navigator.storage.persist();
        }
    } catch (_) { /* optional */ }
}

/* ============================================================================
   31. BOOTSTRAP
   ============================================================================ */
window.addEventListener('DOMContentLoaded', async () => {
    loadDB();
    await initAttachments();
    applyTheme();

    pruneOrphanAttachments();

    const session = readSession();
    if (session && session.userId && DB.users[session.userId]) {
        initApp(DB.users[session.userId]);
        requestPersistentStorage();
    } else if (session) {
        // Stale session — the account no longer exists locally.
        clearSession();
        showToast('Your saved session could not be restored. Please log in again.', 'warning', 6000);
    }

    if (!Storage.isPersistent()) {
        showToast('Local storage is unavailable. Accounts and posts will not survive a reload.', 'warning', 8000);
    }

    // Auth keyboard shortcuts.
    const loginPass = document.getElementById('loginPassword');
    const regPass = document.getElementById('regPassword');
    if (loginPass) loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    if (regPass)   regPass.addEventListener('keydown',   e => { if (e.key === 'Enter') register(); });

    // Composer shortcuts.
    const postInput = document.getElementById('postInput');
    if (postInput) {
        postInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                postMessage();
            }
        });
    }

    const chatInput = document.getElementById('chatInput');
    if (chatInput) {
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
        });
        chatInput.addEventListener('input', onChatInputTyping);
    }
});
